<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Owner Dashboard - LocalShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #176b24;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .shop-small {
      font-size: 12px;
      opacity: .9;
      margin-top: 3px;
    }

    .logout {
      background: white;
      color: #176b24;
      border: none;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px 50px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #0001;
      margin-bottom: 20px;
    }

    .welcome h1 {
      color: #176b24;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #666;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 13px;
      box-shadow: 0 4px 15px #0001;
    }

    .stat-icon {
      font-size: 25px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: bold;
      color: #176b24;
      margin-top: 5px;
    }

    .stat-label {
      color: #777;
      font-size: 13px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px #0001;
      margin-bottom: 20px;
    }

    .panel h2 {
      color: #176b24;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      background: white;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #176b24;
      box-shadow: 0 0 0 3px #176b2415;
    }

    .unit-info {
      background: #f1f8f2;
      color: #176b24;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .quantity-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-option {
      border: 1px solid #176b24;
      background: white;
      color: #176b24;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }

    .quantity-option.active {
      background: #176b24;
      color: white;
    }

    .image-preview {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      background: #eee;
      margin-top: 10px;
      display: none;
    }

    .stock-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stock-btn {
      flex: 1;
      min-width: 120px;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    .stock-btn.active-in {
      background: #e4f7e8;
      border-color: #176b24;
      color: #176b24;
    }

    .stock-btn.active-out {
      background: #ffe5e5;
      border-color: #d62828;
      color: #d62828;
    }

    .main-btn {
      width: 100%;
      border: none;
      background: #176b24;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid #176b24;
      background: white;
      color: #176b24;
      padding: 11px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 15px;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #eee;
    }

    .product-body {
      padding: 13px;
    }

    .product-body h3 {
      color: #176b24;
      margin-bottom: 5px;
    }

    .product-body p {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .product-price {
      font-size: 17px;
      font-weight: bold;
      color: #176b24;
      margin: 8px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: bold;
    }

    .in {
      background: #e4f7e8;
      color: #176b24;
    }

    .out {
      background: #ffe5e5;
      color: #d62828;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .card-actions button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit {
      background: #176b24;
      color: white;
    }

    .delete {
      background: #d62828;
      color: white;
    }

    .error,
    .success {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .error {
      background: #ffe5e5;
      color: #c62828;
    }

    .success {
      background: #e4f7e8;
      color: #176b24;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px;
      border: 1px dashed #ccc;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <div>
      <div class="logo">
        🏪 LocalShop Owner
      </div>

      <div
        id="headerShop"
        class="shop-small"
      >
        Shop Dashboard
      </div>
    </div>

    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<main class="container">

  <section class="welcome">

    <h1 id="welcomeTitle">
      Welcome
    </h1>

    <p>
      अपने shop के products यहाँ से manage करें।
    </p>

  </section>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <div class="stat-icon">
        📦
      </div>

      <div
        id="totalProducts"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Total Products
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🟢
      </div>

      <div
        id="inStockProducts"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        In Stock
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🔴
      </div>

      <div
        id="outStockProducts"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Out of Stock
      </div>

    </div>

  </section>


  <!-- ADD PRODUCT -->

  <section class="panel">

    <h2 id="formTitle">
      ➕ Add New Product
    </h2>


    <div
      id="errorMessage"
      class="error"
    ></div>


    <div
      id="successMessage"
      class="success"
    ></div>


    <form id="productForm">

      <div class="grid">

        <div class="group">

          <label for="productName">
            Product Name *
          </label>

          <input
            id="productName"
            type="text"
            placeholder="Example: Rice"
            required
          >

        </div>


        <div class="group">

          <label for="category">
            Category *
          </label>

          <input
            id="category"
            type="text"
            placeholder="Example: Grocery"
            required
          >

        </div>


        <div class="group">

          <label for="price">
            Price *
          </label>

          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="Example: 60"
            required
          >

        </div>


        <div class="group">

          <label for="unit">
            Selling Unit *
          </label>

          <select
            id="unit"
            required
          >

            <option value="kg">
              Kilogram (kg)
            </option>

            <option value="gram">
              Gram (g)
            </option>

            <option value="litre">
              Litre (L)
            </option>

            <option value="ml">
              Millilitre (ml)
            </option>

            <option value="piece">
              Piece
            </option>

            <option value="dozen">
              Dozen
            </option>

          </select>

        </div>


        <div class="group full">

          <label>
            Customer Quantity Options
          </label>

          <div
            id="quantityOptions"
            class="quantity-options"
          ></div>

          <div
            id="unitInfo"
            class="unit-info"
          ></div>

        </div>


        <div class="group full">

          <label for="description">
            Product Description
          </label>

          <textarea
            id="description"
            placeholder="Product के बारे में लिखें..."
          ></textarea>

        </div>


        <div class="group full">

          <label for="imageUrl">
            Product Image URL
          </label>

          <input
            id="imageUrl"
            type="url"
            placeholder="https://example.com/product.jpg"
          >

          <img
            id="imagePreview"
            class="image-preview"
            alt="Product Preview"
          >

        </div>


        <div class="group full">

          <label>
            Stock Status
          </label>

          <div class="stock-box">

            <button
              type="button"
              id="inStockBtn"
              class="stock-btn active-in"
              onclick="setStock(true)"
            >
              🟢 In Stock
            </button>

            <button
              type="button"
              id="outStockBtn"
              class="stock-btn"
              onclick="setStock(false)"
            >
              🔴 Out of Stock
            </button>

          </div>

        </div>

      </div>


      <button
        type="submit"
        id="saveBtn"
        class="main-btn"
      >
        ➕ Add Product
      </button>


      <button
        type="button"
        id="cancelEditBtn"
        class="secondary-btn"
        style="display:none;"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

    </form>

  </section>


  <!-- PRODUCT LIST -->

  <section class="panel">

    <h2>
      📦 My Products
    </h2>

    <div
      id="productList"
      class="product-list"
    ></div>

  </section>

</main>


<script>

  /* =========================================
     CHECK OWNER SESSION
  ========================================= */

  let session = null;

  try {
    session = JSON.parse(
      sessionStorage.getItem(
        "localShopOwnerSession"
      )
    );
  } catch (error) {
    session = null;
  }


  /*
   * Recovery for browsers where sessionStorage is cleared.
   * owner-login.html already stores these values after a
   * successful approved-owner login.
   */
  if (!session) {

    const savedOwnerId =
      localStorage.getItem(
        "localShopOwnerId"
      );

    const savedShopId =
      localStorage.getItem(
        "localShopId"
      );

    const savedShopName =
      localStorage.getItem(
        "localShopName"
      );

    if (savedOwnerId && savedShopId) {

      session = {
        uid: savedOwnerId,
        ownerId: savedOwnerId,
        ownerName: "Shop Owner",
        email: "",
        shopId: savedShopId,
        shopName: savedShopName || "My Shop",
        status: "approved"
      };

      sessionStorage.setItem(
        "localShopOwnerSession",
        JSON.stringify(session)
      );

    }

  }


  if (!session) {

    window.location.replace(
      "owner-login.html"
    );

  }


  /* =========================================
     SHOP ID
  ========================================= */

  const currentShopId =
    session
      ? session.shopId
      : "shop001";


  /* =========================================
     SHOP HEADER
  ========================================= */

  if (session) {

    document.getElementById(
      "welcomeTitle"
    ).textContent =
      "Welcome, " +
      session.ownerName;

    document.getElementById(
      "headerShop"
    ).textContent =
      session.shopName +
      " • " +
      session.shopId;

  }


  /* =========================================
     PRODUCT STORAGE KEY
  ========================================= */

  function productStorageKey() {

    return (
      "localShopProducts_" +
      currentShopId
    );

  }


  /* =========================================
     GET PRODUCTS
  ========================================= */

  function getProducts() {

    return (
      JSON.parse(
        localStorage.getItem(
          productStorageKey()
        )
      ) || []
    );

  }


  let products =
    getProducts();


  /* =========================================
     EDIT ID
  ========================================= */

  let editingId = null;


  /* =========================================
     STOCK
  ========================================= */

  let currentStock = true;


  /* =========================================
     QUANTITY OPTIONS
  ========================================= */

  let selectedQuantities = [];


  /* =========================================
     UNIT CHANGE
  ========================================= */

  document
    .getElementById("unit")
    .addEventListener(
      "change",
      function() {

        selectedQuantities = [];

        generateQuantityOptions(
          this.value
        );

      }
    );


  /* =========================================
     GENERATE SMART QUANTITIES
  ========================================= */

  function generateQuantityOptions(
    unit
  ) {

    const container =
      document.getElementById(
        "quantityOptions"
      );

    const info =
      document.getElementById(
        "unitInfo"
      );


    container.innerHTML = "";

    let options = [];


    /*
      KG
    */

    if (
      unit === "kg"
    ) {

      options = [
        {
          value: 0.25,
          label: "250 g"
        },
        {
          value: 0.5,
          label: "500 g"
        },
        {
          value: 0.75,
          label: "750 g"
        },
        {
          value: 1,
          label: "1 kg"
        },
        {
          value: 1.5,
          label: "1.5 kg"
        },
        {
          value: 2,
          label: "2 kg"
        },
        {
          value: 3,
          label: "3 kg"
        },
        {
          value: 5,
          label: "5 kg"
        }
      ];


      info.textContent =
        "Price को 1 kg के हिसाब से रखें। Customer 250g, 500g, 750g आदि चुन सकेगा।";

    }


    /*
      GRAM
    */

    else if (
      unit === "gram"
    ) {

      options = [
        {
          value: 100,
          label: "100 g"
        },
        {
          value: 250,
          label: "250 g"
        },
        {
          value: 500,
          label: "500 g"
        },
        {
          value: 750,
          label: "750 g"
        },
        {
          value: 1000,
          label: "1 kg"
        },
        {
          value: 2000,
          label: "2 kg"
        }
      ];


      info.textContent =
        "Price को 1 gram के हिसाब से रखने के बजाय बेहतर है कि आप 100g/250g जैसे fixed selling price के लिए अलग product रखें।";

    }


    /*
      LITRE
    */

    else if (
      unit === "litre"
    ) {

      options = [
        {
          value: 0.25,
          label: "250 ml"
        },
        {
          value: 0.5,
          label: "500 ml"
        },
        {
          value: 0.75,
          label: "750 ml"
        },
        {
          value: 1,
          label: "1 L"
        },
        {
          value: 1.5,
          label: "1.5 L"
        },
        {
          value: 2,
          label: "2 L"
        },
        {
          value: 5,
          label: "5 L"
        }
      ];


      info.textContent =
        "Customer 250ml, 500ml, 750ml, 1L आदि चुन सकेगा।";

    }


    /*
      ML
    */

    else if (
      unit === "ml"
    ) {

      options = [
        {
          value: 100,
          label: "100 ml"
        },
        {
          value: 250,
          label: "250 ml"
        },
        {
          value: 500,
          label: "500 ml"
        },
        {
          value: 750,
          label: "750 ml"
        },
        {
          value: 1000,
          label: "1 L"
        }
      ];


      info.textContent =
        "Customer अलग-अलग ml quantity चुन सकेगा।";

    }


    /*
      PIECE
    */

    else if (
      unit === "piece"
    ) {

      options = [
        {
          value: 1,
          label: "1 Piece"
        },
        {
          value: 2,
          label: "2 Pieces"
        },
        {
          value: 3,
          label: "3 Pieces"
        },
        {
          value: 5,
          label: "5 Pieces"
        },
        {
          value: 10,
          label: "10 Pieces"
        }
      ];


      info.textContent =
        "Piece में customer जितने pieces चाहिए उतने चुन सकेगा।";

    }


    /*
      DOZEN
    */

    else if (
      unit === "dozen"
    ) {

      options = [
        {
          value: 1,
          label: "1 Dozen"
        },
        {
          value: 2,
          label: "2 Dozen"
        },
        {
          value: 3,
          label: "3 Dozen"
        },
        {
          value: 5,
          label: "5 Dozen"
        }
      ];


      info.textContent =
        "Dozen में customer 1, 2, 3 या ज्यादा dozen चुन सकेगा।";

    }


    options.forEach(
      option => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "quantity-option";


        button.textContent =
          option.label;


        button.onclick =
          function() {

            toggleQuantity(
              option.value,
              option.label,
              button
            );

          };


        container.appendChild(
          button
        );

      }
    );

  }


  /* =========================================
     TOGGLE QUANTITY
  ========================================= */

  function toggleQuantity(
    value,
    label,
    button
  ) {

    const index =
      selectedQuantities.findIndex(
        item =>
          item.value ===
          value
      );


    if (
      index === -1
    ) {

      selectedQuantities.push({

        value:
          value,

        label:
          label

      });

      button.classList.add(
        "active"
      );

    }

    else {

      selectedQuantities.splice(
        index,
        1
      );

      button.classList.remove(
        "active"
      );

    }

  }


  /* =========================================
     STOCK
  ========================================= */

  function setStock(
    value
  ) {

    currentStock =
      value;


    const inBtn =
      document.getElementById(
        "inStockBtn"
      );

    const outBtn =
      document.getElementById(
        "outStockBtn"
      );


    inBtn.classList.toggle(
      "active-in",
      value
    );


    outBtn.classList.toggle(
      "active-out",
      !value
    );

  }


  /* =========================================
     IMAGE PREVIEW
  ========================================= */

  document
    .getElementById("imageUrl")
    .addEventListener(
      "input",
      function() {

        const preview =
          document.getElementById(
            "imagePreview"
          );


        if (
          this.value.trim()
        ) {

          preview.src =
            this.value.trim();

          preview.style.display =
            "block";

        }

        else {

          preview.style.display =
            "none";

        }

      }
    );


  /* =========================================
     SAVE PRODUCTS
  ========================================= */

  function saveProducts() {

    localStorage.setItem(

      productStorageKey(),

      JSON.stringify(
        products
      )

    );

  }


  /* =========================================
     ADD / EDIT PRODUCT
  ========================================= */

  document
    .getElementById(
      "productForm"
    )
    .addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        hideMessages();


        const name =
          document
            .getElementById(
              "productName"
            )
            .value
            .trim();


        const category =
          document
            .getElementById(
              "category"
            )
            .value
            .trim();


        const price =
          Number(
            document
              .getElementById(
                "price"
              )
              .value
          );


        const unit =
          document
            .getElementById(
              "unit"
            )
            .value;


        const description =
          document
            .getElementById(
              "description"
            )
            .value
            .trim();


        const image =
          document
            .getElementById(
              "imageUrl"
            )
            .value
            .trim();


        if (
          !name
        ) {

          showError(
            "Product name डालें।"
          );

          return;

        }


        if (
          !category
        ) {

          showError(
            "Category डालें।"
          );

          return;

        }


        if (
          !price ||
          price <= 0
        ) {

          showError(
            "Valid price डालें।"
          );

          return;

        }


        if (
          selectedQuantities.length ===
          0
        ) {

          showError(
            "कम से कम एक customer quantity option चुनें।"
          );

          return;

        }


        /*
          EDIT
        */

        if (
          editingId !== null
        ) {

          const product =
            products.find(
              item =>
                Number(
                  item.id
                ) ===
                Number(
                  editingId
                )
            );


          if (product) {

            product.name =
              name;

            product.category =
              category;

            product.price =
              price;

            product.unit =
              unit;

            product.description =
              description;

            product.image =
              image;

            product.inStock =
              currentStock;

            product.quantityOptions =
              selectedQuantities;

          }


          showSuccess(
            "Product successfully updated."
          );

        }


        /*
          ADD
        */

        else {

          products.push({

            id:
              Date.now(),

            shopId:
              currentShopId,

            name:
              name,

            category:
              category,

            price:
              price,

            unit:
              unit,

            description:
              description,

            image:
              image,

            inStock:
              currentStock,

            quantityOptions:
              selectedQuantities,

            createdAt:
              new Date()
                .toISOString()

          });


          showSuccess(
            "Product successfully added."
          );

        }


        saveProducts();

        resetForm();

        renderProducts();

        updateStats();

      }
    );


  /* =========================================
     RENDER PRODUCTS
  ========================================= */

  function renderProducts() {

    const container =
      document.getElementById(
        "productList"
      );


    if (
      products.length === 0
    ) {

      container.innerHTML = `

        <div
          class="empty"
          style="grid-column:1/-1;"
        >

          <h3>
            📦 अभी कोई product नहीं है
          </h3>

          <p style="margin-top:7px;">
            ऊपर से अपना पहला product add करें।
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML = "";


    products
      .slice()
      .reverse()
      .forEach(
        product => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "product-card";


          const image =
            product.image ||
            "https://via.placeholder.com/500x350?text=No+Image";


          const quantities =
            product.quantityOptions ||
            [];


          card.innerHTML = `

            <img
              src="${escapeHtml(
                image
              )}"
              alt="${escapeHtml(
                product.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/500x350?text=No+Image'
              "
            >


            <div class="product-body">

              <h3>
                ${escapeHtml(
                  product.name
                )}
              </h3>


              <p>
                ${escapeHtml(
                  product.category
                )}
              </p>


              <div class="product-price">

                ₹${Number(
                  product.price
                ).toFixed(2)}
                /
                ${escapeHtml(
                  product.unit
                )}

              </div>


              <p>

                Options:

                ${quantities
                  .map(
                    item =>
                      escapeHtml(
                        item.label
                      )
                  )
                  .join(
                    ", "
                  )}

              </p>


              <div style="margin-top:8px;">

                <span
                  class="
                    badge
                    ${
                      product.inStock
                        ? "in"
                        : "out"
                    }
                  "
                >

                  ${
                    product.inStock
                      ? "🟢 In Stock"
                      : "🔴 Out of Stock"
                  }

                </span>

              </div>


              <div class="card-actions">

                <button
                  type="button"
                  class="edit"
                  onclick="
                    editProduct(
                      ${product.id}
                    )
                  "
                >
                  ✏️ Edit
                </button>


                <button
                  type="button"
                  class="delete"
                  onclick="
                    deleteProduct(
                      ${product.id}
                    )
                  "
                >
                  🗑 Remove
                </button>

              </div>

            </div>

          `;


          container.appendChild(
            card
          );

        }
      );

  }


  /* =========================================
     EDIT PRODUCT
  ========================================= */

  function editProduct(
    id
  ) {

    const product =
      products.find(
        item =>
          Number(
            item.id
          ) ===
          Number(id)
      );


    if (!product) {
      return;
    }


    editingId =
      product.id;


    document.getElementById(
      "formTitle"
    ).textContent =
      "✏️ Edit Product";


    document.getElementById(
      "productName"
    ).value =
      product.name;


    document.getElementById(
      "category"
    ).value =
      product.category;


    document.getElementById(
      "price"
    ).value =
      product.price;


    document.getElementById(
      "unit"
    ).value =
      product.unit;


    document.getElementById(
      "description"
    ).value =
      product.description ||
      "";


    document.getElementById(
      "imageUrl"
    ).value =
      product.image ||
      "";


    currentStock =
      product.inStock;


    setStock(
      currentStock
    );


    selectedQuantities =
      product.quantityOptions ||
      [];


    generateQuantityOptions(
      product.unit
    );


    /*
      Activate saved options
    */

    setTimeout(
      function() {

        const buttons =
          document.querySelectorAll(
            ".quantity-option"
          );


        buttons.forEach(
          button => {

            const exists =
              selectedQuantities.some(
                item =>
                  item.label ===
                  button.textContent
              );


            if (exists) {

              button.classList.add(
                "active"
              );

            }

          }
        );

      },
      0
    );


    document.getElementById(
      "saveBtn"
    ).textContent =
      "💾 Update Product";


    document.getElementById(
      "cancelEditBtn"
    ).style.display =
      "block";


    document
      .getElementById(
        "productForm"
      )
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  /* =========================================
     DELETE PRODUCT
  ========================================= */

  function deleteProduct(
    id
  ) {

    const product =
      products.find(
        item =>
          Number(
            item.id
          ) ===
          Number(id)
      );


    if (!product) {
      return;
    }


    const confirmDelete =
      confirm(
        '"' +
        product.name +
        '" को remove करना है?'
      );


    if (
      !confirmDelete
    ) {

      return;

    }


    products =
      products.filter(
        item =>
          Number(
            item.id
          ) !==
          Number(id)
      );


    saveProducts();

    renderProducts();

    updateStats();


    showSuccess(
      "Product removed successfully."
    );

  }


  /* =========================================
     CANCEL EDIT
  ========================================= */

  function cancelEdit() {

    editingId =
      null;


    resetForm();

  }


  /* =========================================
     RESET FORM
  ========================================= */

  function resetForm() {

    document
      .getElementById(
        "productForm"
      )
      .reset();


    editingId =
      null;


    currentStock =
      true;


    selectedQuantities =
      [];


    document.getElementById(
      "formTitle"
    ).textContent =
      "➕ Add New Product";


    document.getElementById(
      "saveBtn"
    ).textContent =
      "➕ Add Product";


    document.getElementById(
      "cancelEditBtn"
    ).style.display =
      "none";


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    setStock(
      true
    );


    generateQuantityOptions(
      "kg"
    );


    document.getElementById(
      "unit"
    ).value =
      "kg";

  }


  /* =========================================
     STATS
  ========================================= */

  function updateStats() {

    const total =
      products.length;


    const inStock =
      products.filter(
        product =>
          product.inStock
      ).length;


    const outStock =
      products.filter(
        product =>
          !product.inStock
      ).length;


    document.getElementById(
      "totalProducts"
    ).textContent =
      total;


    document.getElementById(
      "inStockProducts"
    ).textContent =
      inStock;


    document.getElementById(
      "outStockProducts"
    ).textContent =
      outStock;

  }


  /* =========================================
     MESSAGES
  ========================================= */

  function showError(
    message
  ) {

    const element =
      document.getElementById(
        "errorMessage"
      );


    element.textContent =
      message;


    element.style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function showSuccess(
    message
  ) {

    const element =
      document.getElementById(
        "successMessage"
      );


    element.textContent =
      message;


    element.style.display =
      "block";


    setTimeout(
      function() {

        element.style.display =
          "none";

      },
      3000
    );

  }


  function hideMessages() {

    document.getElementById(
      "errorMessage"
    ).style.display =
      "none";

    document.getElementById(
      "successMessage"
    ).style.display =
      "none";

  }


  /* =========================================
     LOGOUT
  ========================================= */

  function logout() {

    sessionStorage.removeItem(
      "localShopOwnerSession"
    );

    localStorage.removeItem(
      "localShopOwnerId"
    );

    localStorage.removeItem(
      "localShopId"
    );

    localStorage.removeItem(
      "localShopName"
    );

    window.location.href =
      "owner-login.html";

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(text);


    return div.innerHTML;

  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  generateQuantityOptions(
    "kg"
  );

  renderProducts();

  updateStats();

</script>

</body>
</html>
