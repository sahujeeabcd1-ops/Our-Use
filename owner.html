<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard - LocalShop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f5;color:#222}
header{background:#176b24;color:#fff;padding:15px;position:sticky;top:0;z-index:10}
.header{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:20px;font-weight:bold}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}
.logout{background:#fff;color:#176b24}
main{max-width:1050px;margin:auto;padding:22px 15px 40px}
.loading,.panel,.shop-card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 15px #0000000c}
.loading{text-align:center;color:#777}
#mainContent{display:none}
.shop-card{margin-bottom:18px}
.shop-name{font-size:23px;font-weight:bold;color:#176b24;margin-bottom:7px}
.muted{color:#777;font-size:13px;line-height:1.7}
.status{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:20px;background:#ddf5e2;color:#176b24;font-size:11px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel h2{font-size:18px;margin-bottom:15px}
label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
.save{width:100%;background:#176b24;color:#fff}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px;font-weight:bold}
.success{background:#e3f6e6;color:#176b24}.error{background:#ffe5e5;color:#b00000}
.product{border:1px solid #eee;border-radius:10px;padding:13px;margin-bottom:10px}
.product-title{font-weight:bold;margin-bottom:5px}
.product-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.delete{background:#c62828;color:#fff}
.empty{text-align:center;color:#888;padding:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.header{align-items:stretch;flex-direction:column}.logout{width:100%}}
</style>
</head>
<body>

<header>
<div class="header">
<div class="logo">🏪 Owner Dashboard</div>
<button id="logoutBtn" class="btn logout" type="button">Logout</button>
</div>
</header>

<main>
<div id="loading" class="loading">⏳ Dashboard load हो रहा है...</div>

<div id="errorMessage" class="message error"></div>
<div id="successMessage" class="message success"></div>

<div id="mainContent">
<section class="shop-card">
<div id="shopName" class="shop-name">My Shop</div>
<div id="shopInfo" class="muted"></div>
<div class="status">APPROVED</div>
</section>

<div class="grid">
<section class="panel">
<h2>➕ Add Product</h2>
<form id="productForm">
<label for="productName">Product Name</label>
<input id="productName" required placeholder="जैसे Rice">

<label for="productPrice">Price</label>
<input id="productPrice" type="number" min="0" step="0.01" required placeholder="100">

<label for="productDescription">Description</label>
<textarea id="productDescription" placeholder="Product details"></textarea>

<button class="btn save" type="submit">Save Product</button>
</form>
</section>

<section class="panel">
<h2>📦 My Products</h2>
<div id="productList"></div>
</section>
</div>
</div>
</main>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  addDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const loading=document.getElementById("loading");
const mainContent=document.getElementById("mainContent");
const errorMessage=document.getElementById("errorMessage");
const successMessage=document.getElementById("successMessage");
const shopName=document.getElementById("shopName");
const shopInfo=document.getElementById("shopInfo");
const productList=document.getElementById("productList");
const productForm=document.getElementById("productForm");
const logoutBtn=document.getElementById("logoutBtn");

let currentUser=null;
let currentShopId=null;

function showError(message){
  errorMessage.textContent=message;
  errorMessage.style.display="block";
  successMessage.style.display="none";
}
function showSuccess(message){
  successMessage.textContent=message;
  successMessage.style.display="block";
  errorMessage.style.display="none";
}
function escapeHTML(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

async function findOwnerShop(user){
  let ownerData={};
  let shopId="";

  const ownerSnap=await getDoc(doc(db,"owners",user.uid));

  if(ownerSnap.exists()){
    ownerData=ownerSnap.data()||{};
    shopId=String(ownerData.shopId||"").trim();
  }

  if(shopId){
    const shopSnap=await getDoc(doc(db,"shops",shopId));
    if(shopSnap.exists()){
      return {ownerData,shopId,shopData:shopSnap.data()||{}};
    }
  }

  const q=query(
    collection(db,"shops"),
    where("ownerId","==",user.uid)
  );

  const snap=await getDocs(q);

  for(const d of snap.docs){
    const data=d.data()||{};
    if(String(data.status||"").toLowerCase()==="approved"){
      return {ownerData,shopId:d.id,shopData:data};
    }
  }

  if(snap.docs.length){
    const d=snap.docs[0];
    return {ownerData,shopId:d.id,shopData:d.data()||{}};
  }

  return null;
}

onAuthStateChanged(auth,async user=>{
  try{
    if(!user){
      location.replace("owner-login.html");
      return;
    }

    currentUser=user;

    const result=await findOwnerShop(user);

    if(!result){
      await signOut(auth);
      showError("इस account से कोई shop नहीं मिली।");
      loading.textContent="❌ Shop नहीं मिली।";
      return;
    }

    const {ownerData,shopId,shopData}=result;
    const status=String(shopData.status||"").toLowerCase();

    if(status!=="approved"){
      await signOut(auth);
      location.replace("owner-login.html");
      return;
    }

    if(
      shopData.ownerId &&
      String(shopData.ownerId)!==String(user.uid)
    ){
      await signOut(auth);
      showError("यह shop इस owner account से जुड़ी नहीं है।");
      loading.textContent="❌ Owner verification failed.";
      return;
    }

    currentShopId=shopId;

    sessionStorage.setItem(
      "localShopOwnerSession",
      JSON.stringify({
        uid:user.uid,
        ownerId:user.uid,
        ownerName:ownerData.name||shopData.ownerName||user.displayName||"Shop Owner",
        email:user.email||"",
        shopId,
        shopName:shopData.name||"My Shop",
        status:"approved"
      })
    );

    shopName.textContent=shopData.name||"My Shop";
    shopInfo.innerHTML=
      "<strong>Owner:</strong> "+escapeHTML(ownerData.name||shopData.ownerName||user.displayName||"Shop Owner")+
      "<br><strong>Email:</strong> "+escapeHTML(user.email||"")+
      "<br><strong>Location:</strong> "+escapeHTML(shopData.location||"Not provided")+
      "<br><strong>Phone:</strong> "+escapeHTML(shopData.phone||"Not provided");

    loading.style.display="none";
    mainContent.style.display="block";

    await loadProducts();

  }catch(error){
    console.error("OWNER DASHBOARD ERROR:",error);
    showError(
      error.code==="permission-denied"
      ? "Firestore permission denied है। Firebase Rules check करें।"
      : "Dashboard load नहीं हो पाया।"
    );
    loading.textContent="❌ Dashboard load नहीं हुआ।";
  }
});

async function loadProducts(){
  productList.innerHTML='<div class="empty">⏳ Products load हो रहे हैं...</div>';

  try{
    const q=query(
      collection(db,"products"),
      where("shopId","==",currentShopId)
    );

    const snap=await getDocs(q);

    if(snap.empty){
      productList.innerHTML='<div class="empty">अभी कोई product नहीं है।</div>';
      return;
    }

    productList.innerHTML="";

    snap.forEach(d=>{
      const p=d.data()||{};
      const item=document.createElement("div");
      item.className="product";
      item.innerHTML=`
        <div class="product-row">
          <div>
            <div class="product-title">${escapeHTML(p.name||"Product")}</div>
            <div class="muted">₹${escapeHTML(p.price??0)}</div>
            <div class="muted">${escapeHTML(p.description||"")}</div>
          </div>
          <button class="btn delete" data-id="${escapeHTML(d.id)}" type="button">Delete</button>
        </div>`;
      productList.appendChild(item);
    });

  }catch(error){
    console.error(error);
    productList.innerHTML='<div class="empty">❌ Products load नहीं हुए।</div>';
  }
}

productForm.addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentShopId||!currentUser)return;

  const name=document.getElementById("productName").value.trim();
  const price=Number(document.getElementById("productPrice").value);
  const description=document.getElementById("productDescription").value.trim();

  if(!name||!Number.isFinite(price)||price<0){
    showError("Product name और valid price डालें।");
    return;
  }

  try{
    await addDoc(collection(db,"products"),{
      name,
      price,
      description,
      shopId:currentShopId,
      ownerId:currentUser.uid,
      status:"active",
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

    productForm.reset();
    showSuccess("✅ Product save हो गया।");
    await loadProducts();

  }catch(error){
    console.error(error);
    showError(
      error.code==="permission-denied"
      ? "Product save करने की Firestore permission नहीं है।"
      : "Product save नहीं हुआ।"
    );
  }
});

productList.addEventListener("click",async e=>{
  const btn=e.target.closest("button[data-id]");
  if(!btn)return;

  const id=btn.dataset.id;

  if(!confirm("यह product delete करना है?"))return;

  try{
    await deleteDoc(doc(db,"products",id));
    showSuccess("🗑️ Product delete हो गया।");
    await loadProducts();
  }catch(error){
    console.error(error);
    showError("Product delete नहीं हुआ।");
  }
});

logoutBtn.addEventListener("click",async()=>{
  try{
    sessionStorage.removeItem("localShopOwnerSession");
    localStorage.removeItem("localShopOwnerId");
    localStorage.removeItem("localShopId");
    localStorage.removeItem("localShopName");
    await signOut(auth);
    location.replace("owner-login.html");
  }catch(error){
    console.error(error);
    showError("Logout नहीं हो पाया।");
  }
});
</script>
</body>
</html>
