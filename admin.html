<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Our Use</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #222;
    }

    header {
      background: #176b24;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logout-btn {
      border: none;
      background: white;
      color: #176b24;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 40px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #777;
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0000000d;
    }

    .stat-title {
      color: #777;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
      color: #176b24;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-btn {
      border: 1px solid #ddd;
      background: white;
      color: #333;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #176b24;
      color: white;
      border-color: #176b24;
    }

    .shops-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .shop-card {
      background: white;
      border-radius: 14px;
      padding: 17px;
      box-shadow: 0 4px 15px #0000000d;
    }

    .shop-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .shop-icon {
      width: 50px;
      height: 50px;
      background: #e8f5ea;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .status {
      height: fit-content;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .status.approved {
      background: #dff5e3;
      color: #176b24;
    }

    .status.rejected {
      background: #ffe3e3;
      color: #b00000;
    }

    .shop-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shop-info {
      color: #666;
      font-size: 12px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .approve-btn {
      background: #176b24;
      color: white;
    }

    .reject-btn {
      background: #c62828;
      color: white;
    }

    .action-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .empty,
    .loading,
    .error {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
      font-size: 13px;
    }

    .error {
      background: #ffe8e8;
      color: #b00000;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 9px;
      font-size: 13px;
    }

    .success-message {
      background: #e5f6e8;
      color: #176b24;
    }

    .error-message {
      background: #ffe5e5;
      color: #b00000;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .shops-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="header-inner">

      <div class="logo">
        🛡️ Our Use Admin
      </div>

      <button
        id="logoutBtn"
        type="button"
        class="logout-btn"
      >
        Logout
      </button>

    </div>

  </header>


  <main>

    <!-- WELCOME -->
    <section class="welcome">

      <h1>
        Admin Dashboard
      </h1>

      <p>
        Shops की registration और approval manage करें।
      </p>

    </section>


    <!-- MESSAGE -->
    <div
      id="successMessage"
      class="message success-message"
    ></div>

    <div
      id="errorMessage"
      class="message error-message"
    ></div>


    <!-- STATS -->
    <section class="stats">

      <div class="stat-card">

        <div class="stat-title">
          Pending Shops
        </div>

        <div
          id="pendingCount"
          class="stat-number"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          Approved Shops
        </div>

        <div
          id="approvedCount"
          class="stat-number"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          Rejected Shops
        </div>

        <div
          id="rejectedCount"
          class="stat-number"
        >
          0
        </div>

      </div>

    </section>


    <!-- SHOP LIST -->
    <section>

      <h2 class="section-title">
        Shop Applications
      </h2>


      <div class="filter-buttons">

        <button
          type="button"
          class="filter-btn active"
          data-filter="pending"
        >
          Pending
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="approved"
        >
          Approved
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="rejected"
        >
          Rejected
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="all"
        >
          All
        </button>

      </div>


      <div
        id="shopsContainer"
        class="shops-container"
      >

        <div class="loading">
          Shops load हो रही हैं...
        </div>

      </div>

    </section>

  </main>


  <script type="module">

    /* =====================================
       FIREBASE
    ===================================== */

    import {
      auth,
      db
    } from "./firebase.js";


    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      collection,
      getDocs,
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================
       ELEMENTS
    ===================================== */

    const shopsContainer =
      document.getElementById(
        "shopsContainer"
      );

    const pendingCount =
      document.getElementById(
        "pendingCount"
      );

    const approvedCount =
      document.getElementById(
        "approvedCount"
      );

    const rejectedCount =
      document.getElementById(
        "rejectedCount"
      );

    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );

    const successMessage =
      document.getElementById(
        "successMessage"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =====================================
       VARIABLES
    ===================================== */

    let allShops = [];

    let currentFilter =
      "pending";


    /* =====================================
       AUTH CHECK
    ===================================== */

    onAuthStateChanged(
      auth,
      async function(user) {

        if (!user) {

          window.location.href =
            "admin-login.html";

          return;

        }


        try {

          const adminRef =
            doc(
              db,
              "admins",
              user.uid
            );


          const adminSnap =
            await getDoc(
              adminRef
            );


          if (
            !adminSnap.exists()
          ) {

            await signOut(
              auth
            );

            window.location.href =
              "admin-login.html";

            return;

          }


          const adminData =
            adminSnap.data();


          if (
            adminData.role !==
            "admin"
          ) {

            await signOut(
              auth
            );

            window.location.href =
              "admin-login.html";

            return;

          }


          loadShops();

        }

        catch(error) {

          console.error(
            error
          );


          showError(
            "Admin verification failed."
          );

        }

      }
    );


    /* =====================================
       LOAD SHOPS
    ===================================== */

    async function loadShops() {

      shopsContainer.innerHTML = `
        <div class="loading">
          Shops load हो रही हैं...
        </div>
      `;


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "shops"
            )
          );


        allShops = [];


        snapshot.forEach(
          function(shopDoc) {

            allShops.push({

              id:
                shopDoc.id,

              ...shopDoc.data()

            });

          }
        );


        updateStats();

        renderShops();


      }

      catch(error) {

        console.error(
          error
        );


        shopsContainer.innerHTML = `
          <div class="error">
            Shops load नहीं हो पाईं।<br>
            Firestore rules और Firebase connection check करें।
          </div>
        `;

      }

    }


    /* =====================================
       UPDATE STATS
    ===================================== */

    function updateStats() {

      let pending = 0;
      let approved = 0;
      let rejected = 0;


      allShops.forEach(
        function(shop) {

          if (
            shop.status ===
            "pending"
          ) {

            pending++;

          }

          else if (
            shop.status ===
            "approved"
          ) {

            approved++;

          }

          else if (
            shop.status ===
            "rejected"
          ) {

            rejected++;

          }

        }
      );


      pendingCount.textContent =
        pending;

      approvedCount.textContent =
        approved;

      rejectedCount.textContent =
        rejected;

    }


    /* =====================================
       RENDER SHOPS
    ===================================== */

    function renderShops() {

      let shops =
        allShops;


      if (
        currentFilter !==
        "all"
      ) {

        shops =
          allShops.filter(
            function(shop) {

              return (
                shop.status ===
                currentFilter
              );

            }
          );

      }


      if (
        shops.length ===
        0
      ) {

        shopsContainer.innerHTML = `
          <div class="empty">
            इस category में कोई shop नहीं है।
          </div>
        `;

        return;

      }


      shopsContainer.innerHTML =
        "";


      shops.forEach(
        function(shop) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "shop-card";


          const status =
            shop.status ||
            "pending";


          let statusText =
            "Pending";


          if (
            status ===
            "approved"
          ) {

            statusText =
              "Approved";

          }

          else if (
            status ===
            "rejected"
          ) {

            statusText =
              "Rejected";

          }


          card.innerHTML = `

            <div class="shop-top">

              <div class="shop-icon">
                🏪
              </div>

              <div
                class="status ${escapeHTML(
                  status
                )}"
              >
                ${statusText}
              </div>

            </div>


            <div class="shop-name">
              ${escapeHTML(
                shop.name ||
                "Unnamed Shop"
              )}
            </div>


            <div class="shop-info">

              📍 Location:
              ${escapeHTML(
                shop.location ||
                "Not provided"
              )}

              <br>

              👤 Owner:
              ${escapeHTML(
                shop.ownerName ||
                shop.ownerId ||
                "Not provided"
              )}

              <br>

              🆔 Shop ID:
              ${escapeHTML(
                shop.id
              )}

              <br>

              👤 Owner ID:
              ${escapeHTML(
                shop.ownerId ||
                "Not provided"
              )}

            </div>


            ${
              status ===
              "pending"
              ? `

                <div class="actions">

                  <button
                    type="button"
                    class="action-btn approve-btn"
                    data-action="approve"
                    data-id="${escapeHTML(
                      shop.id
                    )}"
                  >
                    ✅ Approve
                  </button>


                  <button
                    type="button"
                    class="action-btn reject-btn"
                    data-action="reject"
                    data-id="${escapeHTML(
                      shop.id
                    )}"
                  >
                    ❌ Reject
                  </button>

                </div>

              `
              : ""
            }

          `;


          shopsContainer.appendChild(
            card
          );

        }
      );

    }


    /* =====================================
       APPROVE / REJECT
    ===================================== */

    shopsContainer.addEventListener(
      "click",
      async function(event) {

        const button =
          event.target.closest(
            "button[data-action]"
          );


        if (!button) {
          return;
        }


        const shopId =
          button.dataset.id;


        const action =
          button.dataset.action;


        if (!shopId) {
          return;
        }


        if (
          action ===
          "approve"
        ) {

          const confirmed =
            confirm(
              "क्या आप इस shop को APPROVE करना चाहते हैं?"
            );


          if (!confirmed) {
            return;
          }

        }


        if (
          action ===
          "reject"
        ) {

          const confirmed =
            confirm(
              "क्या आप इस shop को REJECT करना चाहते हैं?"
            );


          if (!confirmed) {
            return;
          }

        }


        button.disabled =
          true;


        try {

          const shopRef =
            doc(
              db,
              "shops",
              shopId
            );


          if (
            action ===
            "approve"
          ) {

            await updateDoc(
              shopRef,
              {

                status:
                  "approved",

                approvedAt:
                  serverTimestamp(),

                rejectedAt:
                  null

              }
            );


            showSuccess(
              "Shop successfully approved."
            );

          }


          if (
            action ===
            "reject"
          ) {

            await updateDoc(
              shopRef,
              {

                status:
                  "rejected",

                rejectedAt:
                  serverTimestamp(),

                approvedAt:
                  null

              }
            );


            showSuccess(
              "Shop rejected."
            );

          }


          await loadShops();

        }

        catch(error) {

          console.error(
            error
          );


          showError(
            "Shop status update नहीं हो सका। Firestore Rules check करें।"
          );


          button.disabled =
            false;

        }

      }
    );


    /* =====================================
       FILTER BUTTONS
    ===================================== */

    document
      .querySelectorAll(
        ".filter-btn"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              document
                .querySelectorAll(
                  ".filter-btn"
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              button.classList.add(
                "active"
              );


              currentFilter =
                button.dataset.filter;


              renderShops();

            }
          );

        }
      );


    /* =====================================
       LOGOUT
    ===================================== */

    logoutBtn.addEventListener(
      "click",
      async function() {

        try {

          await signOut(
            auth
          );


          localStorage.removeItem(
            "localShopAdminId"
          );


          localStorage.removeItem(
            "localShopAdminLoggedIn"
          );


          window.location.href =
            "admin-login.html";

        }

        catch(error) {

          console.error(
            error
          );

          showError(
            "Logout नहीं हो सका।"
          );

        }

      }
    );


    /* =====================================
       MESSAGES
    ===================================== */

    function showSuccess(
      message
    ) {

      successMessage.textContent =
        message;

      successMessage.style.display =
        "block";

      errorMessage.style.display =
        "none";


      setTimeout(
        function() {

          successMessage.style.display =
            "none";

        },
        3000
      );

    }


    function showError(
      message
    ) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

      successMessage.style.display =
        "none";

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }

  </script>

</body>
</html>
