<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Our Use</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #222;
    }

    header {
      background: #176b24;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px #0002;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      border: none;
      background: white;
      color: #176b24;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 40px;
    }

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .title p {
      color: #777;
      font-size: 13px;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: bold;
    }

    .success {
      background: #e3f6e6;
      color: #176b24;
    }

    .error {
      background: #ffe5e5;
      color: #b00000;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 4px 15px #0000000c;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .stat-number {
      color: #176b24;
      font-size: 27px;
      font-weight: bold;
    }

    .shop-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .shop-heading h2 {
      font-size: 20px;
    }

    .refresh-btn {
      border: 1px solid #176b24;
      background: white;
      color: #176b24;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      border: 1px solid #ddd;
      background: white;
      color: #333;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #176b24;
      color: white;
      border-color: #176b24;
    }

    .shops {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .shop-card {
      background: white;
      border-radius: 14px;
      padding: 17px;
      box-shadow: 0 4px 15px #0000000c;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 13px;
    }

    .shop-icon {
      width: 52px;
      height: 52px;
      border-radius: 11px;
      background: #e8f5ea;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 27px;
    }

    .status {
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-pending {
      background: #fff2c9;
      color: #856404;
    }

    .status-approved {
      background: #ddf5e2;
      color: #176b24;
    }

    .status-rejected {
      background: #ffe1e1;
      color: #b00000;
    }

    .shop-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .shop-details {
      color: #666;
      font-size: 12px;
      line-height: 1.9;
      word-break: break-word;
    }

    .shop-details strong {
      color: #333;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .action-btn {
      flex: 1;
      min-width: 100px;
      border: none;
      padding: 11px;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve {
      background: #176b24;
    }

    .reject {
      background: #c62828;
    }

    .delete {
      background: #8e0000;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .box {
      background: white;
      border-radius: 13px;
      padding: 28px 15px;
      text-align: center;
      color: #777;
      font-size: 13px;
      grid-column: 1 / -1;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .shops {
        grid-template-columns: 1fr;
      }

      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .header-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .header-btn {
        width: 100%;
      }
    }

    @media (max-width: 450px) {
      .shop-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .refresh-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🛡️ Our Use Admin
    </div>

    <div class="header-buttons">

      <button
        id="homeBtn"
        class="header-btn"
        type="button"
      >
        🏠 Home
      </button>

      <button
        id="logoutBtn"
        class="header-btn"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</header>


<main>

  <div class="title">

    <h1>
      Admin Dashboard
    </h1>

    <p>
      Shops को approve, reject और delete करें।
    </p>

  </div>


  <div
    id="successMessage"
    class="message success"
  ></div>


  <div
    id="errorMessage"
    class="message error"
  ></div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Pending Shops
      </div>

      <div
        id="pendingCount"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Approved Shops
      </div>

      <div
        id="approvedCount"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Rejected Shops
      </div>

      <div
        id="rejectedCount"
        class="stat-number"
      >
        0
      </div>

    </div>

  </div>


  <!-- SHOP HEADING -->

  <div class="shop-heading">

    <h2>
      🏪 Shop Applications
    </h2>

    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button"
    >
      🔄 Refresh
    </button>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter-btn active"
      data-filter="pending"
      type="button"
    >
      Pending
    </button>

    <button
      class="filter-btn"
      data-filter="approved"
      type="button"
    >
      Approved
    </button>

    <button
      class="filter-btn"
      data-filter="rejected"
      type="button"
    >
      Rejected
    </button>

    <button
      class="filter-btn"
      data-filter="all"
      type="button"
    >
      All
    </button>

  </div>


  <!-- SHOPS -->

  <div
    id="shopsContainer"
    class="shops"
  >

    <div class="box">
      ⏳ Shops load हो रही हैं...
    </div>

  </div>

</main>


<script type="module">

  import {
    auth,
    db
  } from "./firebase.js";


  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    query,
    where
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================
     ELEMENTS
  ========================= */

  const shopsContainer =
    document.getElementById(
      "shopsContainer"
    );

  const pendingCount =
    document.getElementById(
      "pendingCount"
    );

  const approvedCount =
    document.getElementById(
      "approvedCount"
    );

  const rejectedCount =
    document.getElementById(
      "rejectedCount"
    );

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  const homeBtn =
    document.getElementById(
      "homeBtn"
    );

  const successMessage =
    document.getElementById(
      "successMessage"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );


  /* =========================
     VARIABLES
  ========================= */

  let shops = [];

  let currentFilter =
    "pending";


  /* =========================
     ADMIN AUTH CHECK
  ========================= */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        window.location.href =
          "admin-login.html";

        return;

      }


      try {

        /*
         * Admin document:
         *
         * admins/{ADMIN_UID}
         *
         * role: "admin"
         */

        const adminRef =
          doc(
            db,
            "admins",
            user.uid
          );


        const adminSnapshot =
          await getDoc(
            adminRef
          );


        if (
          !adminSnapshot.exists()
        ) {

          await signOut(auth);

          alert(
            "आपके account को admin access नहीं मिला है।"
          );

          window.location.href =
            "admin-login.html";

          return;

        }


        const adminData =
          adminSnapshot.data();


        if (
          adminData.role !==
          "admin"
        ) {

          await signOut(auth);

          alert(
            "Admin permission नहीं है।"
          );

          window.location.href =
            "admin-login.html";

          return;

        }


        loadShops();

      }

      catch(error) {

        console.error(
          "ADMIN CHECK ERROR:",
          error
        );

        showError(
          "Admin verification में problem हुई।"
        );

      }

    }
  );


  /* =========================
     LOAD SHOPS
  ========================= */

  async function loadShops() {

    shopsContainer.innerHTML = `
      <div class="box">
        ⏳ Shops load हो रही हैं...
      </div>
    `;


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "shops"
          )
        );


      shops = [];


      snapshot.forEach(
        function(shopDoc) {

          shops.push({

            id:
              shopDoc.id,

            ...shopDoc.data()

          });

        }
      );


      updateStats();

      renderShops();

    }

    catch(error) {

      console.error(
        "LOAD SHOPS ERROR:",
        error
      );


      shopsContainer.innerHTML = `
        <div class="box">
          ❌ Shops load नहीं हो पाईं।
          <br><br>
          Firestore Rules या Firebase connection check करें।
        </div>
      `;

    }

  }


  /* =========================
     STATS
  ========================= */

  function updateStats() {

    let pending = 0;
    let approved = 0;
    let rejected = 0;


    shops.forEach(
      function(shop) {

        const status =
          shop.status ||
          "pending";


        if (
          status === "pending"
        ) {
          pending++;
        }


        if (
          status === "approved"
        ) {
          approved++;
        }


        if (
          status === "rejected"
        ) {
          rejected++;
        }

      }
    );


    pendingCount.textContent =
      pending;

    approvedCount.textContent =
      approved;

    rejectedCount.textContent =
      rejected;

  }


  /* =========================
     RENDER SHOPS
  ========================= */

  function renderShops() {

    let filtered =
      shops;


    if (
      currentFilter !==
      "all"
    ) {

      filtered =
        shops.filter(
          function(shop) {

            return (
              shop.status ||
              "pending"
            ) ===
            currentFilter;

          }
        );

    }


    if (
      filtered.length === 0
    ) {

      shopsContainer.innerHTML = `
        <div class="box">
          📭 इस section में कोई shop नहीं है।
        </div>
      `;

      return;

    }


    shopsContainer.innerHTML =
      "";


    filtered.forEach(
      function(shop) {

        const status =
          shop.status ||
          "pending";


        let statusClass =
          "status-pending";

        let statusText =
          "Pending";


        if (
          status ===
          "approved"
        ) {

          statusClass =
            "status-approved";

          statusText =
            "Approved";

        }


        if (
          status ===
          "rejected"
        ) {

          statusClass =
            "status-rejected";

          statusText =
            "Rejected";

        }


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "shop-card";


        card.innerHTML = `

          <div class="shop-header">

            <div class="shop-icon">
              🏪
            </div>

            <div
              class="status ${statusClass}"
            >
              ${statusText}
            </div>

          </div>


          <div class="shop-name">
            ${escapeHTML(
              shop.name ||
              "Shop Name नहीं है"
            )}
          </div>


          <div class="shop-details">

            <strong>Shop ID:</strong>
            ${escapeHTML(shop.id)}

            <br>

            <strong>Owner ID:</strong>
            ${escapeHTML(
              shop.ownerId ||
              "Not provided"
            )}

            <br>

            <strong>Location:</strong>
            ${escapeHTML(
              shop.location ||
              "Not provided"
            )}

            <br>

            <strong>Phone:</strong>
            ${escapeHTML(
              shop.phone ||
              "Not provided"
            )}

            <br>

            <strong>Status:</strong>
            ${escapeHTML(status)}

          </div>


          <div class="actions">

            ${
              status === "pending"
              ?

              `
                <button
                  type="button"
                  class="action-btn approve"
                  data-action="approve"
                  data-id="${escapeHTML(shop.id)}"
                >
                  ✅ Approve
                </button>

                <button
                  type="button"
                  class="action-btn reject"
                  data-action="reject"
                  data-id="${escapeHTML(shop.id)}"
                >
                  ❌ Reject
                </button>
              `

              :

              ""
            }


            ${
              status === "approved"
              ?

              `
                <button
                  type="button"
                  class="action-btn delete"
                  data-action="delete"
                  data-id="${escapeHTML(shop.id)}"
                >
                  🗑️ Delete Shop
                </button>
              `

              :

              ""
            }

          </div>

        `;


        shopsContainer.appendChild(
          card
        );

      }
    );

  }


  /* =========================
     ACTIONS
  ========================= */

  shopsContainer.addEventListener(
    "click",
    async function(event) {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if (!button) {
        return;
      }


      const shopId =
        button.dataset.id;


      const action =
        button.dataset.action;


      if (!shopId) {
        return;
      }


      /*
       * APPROVE
       */

      if (
        action ===
        "approve"
      ) {

        const confirmed =
          confirm(
            "क्या आप इस Shop को APPROVE करना चाहते हैं?"
          );


        if (!confirmed) {
          return;
        }


        await changeShopStatus(
          shopId,
          "approved",
          button
        );


        return;

      }


      /*
       * REJECT
       */

      if (
        action ===
        "reject"
      ) {

        const confirmed =
          confirm(
            "क्या आप इस Shop को REJECT करना चाहते हैं?"
          );


        if (!confirmed) {
          return;
        }


        await changeShopStatus(
          shopId,
          "rejected",
          button
        );


        return;

      }


      /*
       * DELETE
       */

      if (
        action ===
        "delete"
      ) {

        /*
         * Extra warning क्योंकि delete permanent है।
         */

        const confirmed =
          confirm(
            "⚠️ यह Approved Shop permanently delete हो जाएगी।\n\nक्या आप सच में इसे DELETE करना चाहते हैं?"
          );


        if (!confirmed) {
          return;
        }


        const finalConfirmed =
          confirm(
            "⚠️ अंतिम पुष्टि:\n\nShop को permanently delete करें?"
          );


        if (!finalConfirmed) {
          return;
        }


        await deleteShop(
          shopId,
          button
        );

      }

    }
  );


  /* =========================
     CHANGE STATUS
  ========================= */

  async function changeShopStatus(
    shopId,
    newStatus,
    button
  ) {

    button.disabled =
      true;


    try {

      const shopRef =
        doc(
          db,
          "shops",
          shopId
        );


      if (
        newStatus ===
        "approved"
      ) {

        await updateDoc(
          shopRef,
          {

            status:
              "approved",

            approvedAt:
              serverTimestamp(),

            rejectedAt:
              null

          }
        );


        showSuccess(
          "✅ Shop approved successfully!"
        );

      }


      else {

        await updateDoc(
          shopRef,
          {

            status:
              "rejected",

            rejectedAt:
              serverTimestamp(),

            approvedAt:
              null

          }
        );


        showSuccess(
          "❌ Shop rejected."
        );

      }


      await loadShops();

    }

    catch(error) {

      console.error(
        "STATUS UPDATE ERROR:",
        error
      );


      showError(
        "Shop status update नहीं हुआ। Firestore Rules check करें।"
      );


      button.disabled =
        false;

    }

  }


  /* =========================
     DELETE SHOP
  ========================= */

  async function deleteShop(
    shopId,
    button
  ) {

    button.disabled =
      true;

    button.textContent =
      "⏳ Deleting...";


    try {

      /*
       * पहले check करते हैं कि
       * shop अभी भी approved है।
       */

      const shopRef =
        doc(
          db,
          "shops",
          shopId
        );


      const shopSnapshot =
        await getDoc(
          shopRef
        );


      if (
        !shopSnapshot.exists()
      ) {

        showError(
          "Shop पहले ही delete हो चुकी है।"
        );

        await loadShops();

        return;

      }


      const shopData =
        shopSnapshot.data();


      if (
        shopData.status !==
        "approved"
      ) {

        showError(
          "सिर्फ Approved Shop को delete किया जा सकता है।"
        );

        await loadShops();

        return;

      }


      /*
       * Shop delete
       */

      await deleteDoc(
        shopRef
      );


      /*
       * IMPORTANT:
       *
       * यह सिर्फ shops collection
       * का document delete करता है।
       *
       * उसके products अलग collection में
       * हों तो वे अपने-आप delete नहीं होंगे।
       */


      showSuccess(
        "🗑️ Approved Shop successfully deleted!"
      );


      await loadShops();

    }

    catch(error) {

      console.error(
        "DELETE SHOP ERROR:",
        error
      );


      showError(
        "Shop delete नहीं हुई। Firestore Rules check करें।"
      );


      button.disabled =
        false;

      button.textContent =
        "🗑️ Delete Shop";

    }

  }


  /* =========================
     FILTERS
  ========================= */

  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".filter-btn"
              )
              .forEach(
                function(btn) {

                  btn.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderShops();

          }
        );

      }
    );


  /* =========================
     REFRESH
  ========================= */

  refreshBtn.addEventListener(
    "click",
    async function() {

      refreshBtn.disabled =
        true;

      refreshBtn.textContent =
        "⏳ Loading...";


      await loadShops();


      refreshBtn.disabled =
        false;

      refreshBtn.textContent =
        "🔄 Refresh";

    }
  );


  /* =========================
     HOME
  ========================= */

  homeBtn.addEventListener(
    "click",
    function() {

      window.location.href =
        "index.html";

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener(
    "click",
    async function() {

      const confirmed =
        confirm(
          "क्या आप Admin logout करना चाहते हैं?"
        );


      if (!confirmed) {
        return;
      }


      try {

        await signOut(
          auth
        );


        window.location.href =
          "admin-login.html";

      }

      catch(error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );


        showError(
          "Logout नहीं हो सका।"
        );

      }

    }
  );


  /* =========================
     SUCCESS MESSAGE
  ========================= */

  function showSuccess(
    message
  ) {

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

    errorMessage.style.display =
      "none";


    setTimeout(
      function() {

        successMessage.style.display =
          "none";

      },
      3500
    );

  }


  /* =========================
     ERROR MESSAGE
  ========================= */

  function showError(
    message
  ) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

    successMessage.style.display =
      "none";

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(
    value
  ) {

    return String(
      value
    )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

  }

</script>
