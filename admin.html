<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalShop Admin Panel</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    /* HEADER */

    header {
      background: #172019;
      color: white;
      padding: 15px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #ff6f00;
    }

    .logout {
      border: none;
      background: #fff;
      color: #172019;

      padding: 9px 15px;
      border-radius: 8px;

      font-weight: bold;
      cursor: pointer;
    }

    /* MAIN */

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      color: #176b24;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #777;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;

      margin-bottom: 25px;
    }

    .stat {
      background: white;

      padding: 20px;

      border-radius: 14px;

      box-shadow: 0 4px 15px #0001;
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      color: #176b24;
    }

    .stat-label {
      margin-top: 5px;
      color: #777;
    }

    /* PANEL */

    .panel {
      background: white;

      padding: 20px;

      border-radius: 15px;

      box-shadow: 0 4px 15px #0001;

      margin-bottom: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      margin-bottom: 18px;
    }

    .panel-header h2 {
      color: #176b24;
    }

    /* SEARCH */

    .search {
      padding: 10px 12px;

      border: 1px solid #ddd;

      border-radius: 8px;

      outline: none;
    }

    /* REQUEST CARD */

    .request-card {
      border: 1px solid #eee;

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 12px;

      display: grid;

      grid-template-columns: 1fr auto;

      gap: 15px;
    }

    .request-info h3 {
      margin-bottom: 7px;
    }

    .request-info p {
      color: #666;

      font-size: 14px;

      line-height: 1.6;
    }

    .status {
      display: inline-block;

      margin-top: 8px;

      padding: 5px 10px;

      border-radius: 15px;

      font-size: 12px;

      font-weight: bold;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .approved {
      background: #e5f7e8;
      color: #16852a;
    }

    .rejected {
      background: #ffe7e7;
      color: #d62828;
    }

    .suspended {
      background: #eee;
      color: #555;
    }

    /* BUTTONS */

    .actions {
      display: flex;
      align-items: center;

      gap: 8px;

      flex-wrap: wrap;

      justify-content: flex-end;
    }

    .btn {
      border: none;

      padding: 9px 12px;

      border-radius: 7px;

      cursor: pointer;

      font-weight: bold;

      font-size: 12px;
    }

    .approve {
      background: #176b24;
      color: white;
    }

    .reject {
      background: #d62828;
      color: white;
    }

    .suspend {
      background: #555;
      color: white;
    }

    .activate {
      background: #ff9800;
      color: white;
    }

    .view {
      background: #e9f2ff;
      color: #176b24;
    }

    /* EMPTY */

    .empty {
      text-align: center;

      padding: 35px;

      color: #777;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .header-inner {
        flex-direction: column;
      }

      .logout {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .panel-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .request-card {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }

    }

  </style>
</head>

<body>


  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <div class="logo">
        Local<span>Shop</span> Admin
      </div>

      <button
        type="button"
        class="logout"
        onclick="adminLogout()"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="container">


    <div class="welcome">

      <h1>
        Admin Dashboard
      </h1>

      <p>
        Manage Shop Owners, Approvals
        and Shop Accounts
      </p>

    </div>


    <!-- STATS -->

    <section class="stats">


      <div class="stat">

        <div
          class="stat-number"
          id="totalShops"
        >
          0
        </div>

        <div class="stat-label">
          Total Shops
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="pendingShops"
        >
          0
        </div>

        <div class="stat-label">
          Pending Requests
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="approvedShops"
        >
          0
        </div>

        <div class="stat-label">
          Approved Shops
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="suspendedShops"
        >
          0
        </div>

        <div class="stat-label">
          Suspended Shops
        </div>

      </div>


    </section>


    <!-- PENDING REQUESTS -->

    <section class="panel">

      <div class="panel-header">

        <h2>
          📝 Shop Owner Requests
        </h2>

        <input
          type="search"
          id="searchRequest"
          class="search"
          placeholder="Search shop..."
        >

      </div>


      <div id="requestList"></div>

    </section>


    <!-- APPROVED SHOPS -->

    <section class="panel">

      <div class="panel-header">

        <h2>
          🏪 All Shop Accounts
        </h2>

      </div>


      <div id="shopList"></div>

    </section>


  </main>


  <script>


    /* =========================
       DEMO SHOP DATABASE
    ========================= */

    let shops =
      JSON.parse(
        localStorage.getItem(
          "localShopOwners"
        )
      ) || [

        {
          id: 1,

          shopId:
            "shop001",

          shopName:
            "Shop A",

          ownerName:
            "Rahul Kumar",

          phone:
            "9999999999",

          location:
            "Sarsa Main Road",

          category:
            "Grocery",

          status:
            "approved"

        },

        {
          id: 2,

          shopId:
            "shop002",

          shopName:
            "Shop B",

          ownerName:
            "Amit Kumar",

          phone:
            "9999999998",

          location:
            "Sarsa Market Road",

          category:
            "Grocery",

          status:
            "pending"

        },

        {
          id: 3,

          shopId:
            "shop003",

          shopName:
            "Shop C",

          ownerName:
            "Ravi Kumar",

          phone:
            "9999999997",

          location:
            "Sarsa Station Road",

          category:
            "Hardware",

          status:
            "pending"

        }

      ];


    /* =========================
       SAVE
    ========================= */

    function saveShops() {

      localStorage.setItem(
        "localShopOwners",
        JSON.stringify(shops)
      );

    }


    /* =========================
       UPDATE STATS
    ========================= */

    function updateStats() {

      const total =
        shops.length;


      const pending =
        shops.filter(
          shop =>
            shop.status ===
            "pending"
        ).length;


      const approved =
        shops.filter(
          shop =>
            shop.status ===
            "approved"
        ).length;


      const suspended =
        shops.filter(
          shop =>
            shop.status ===
            "suspended"
        ).length;


      document.getElementById(
        "totalShops"
      ).textContent =
        total;


      document.getElementById(
        "pendingShops"
      ).textContent =
        pending;


      document.getElementById(
        "approvedShops"
      ).textContent =
        approved;


      document.getElementById(
        "suspendedShops"
      ).textContent =
        suspended;

    }


    /* =========================
       STATUS CLASS
    ========================= */

    function statusClass(
      status
    ) {

      if (
        status ===
        "approved"
      ) {

        return "approved";

      }


      if (
        status ===
        "rejected"
      ) {

        return "rejected";

      }


      if (
        status ===
        "suspended"
      ) {

        return "suspended";

      }


      return "pending";

    }


    /* =========================
       RENDER REQUESTS
    ========================= */

    function renderRequests(
      search = ""
    ) {

      const container =
        document.getElementById(
          "requestList"
        );


      const query =
        search
          .trim()
          .toLowerCase();


      const requests =
        shops.filter(
          shop => {

            const matchesSearch =
              !query ||
              shop.shopName
                .toLowerCase()
                .includes(query) ||
              shop.ownerName
                .toLowerCase()
                .includes(query);


            return (
              matchesSearch &&
              (
                shop.status ===
                "pending" ||
                shop.status ===
                "rejected"
              )
            );

          }
        );


      if (
        requests.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            No pending requests.

          </div>

        `;

        return;

      }


      container.innerHTML = "";


      requests.forEach(
        shop => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "request-card";


          card.innerHTML = `

            <div class="request-info">

              <h3>
                ${shop.shopName}
              </h3>

              <p>
                👤 Owner:
                ${shop.ownerName}
              </p>

              <p>
                🆔 Shop ID:
                ${shop.shopId}
              </p>

              <p>
                📞 Phone:
                ${shop.phone}
              </p>

              <p>
                📍 Location:
                ${shop.location}
              </p>

              <p>
                🏪 Category:
                ${shop.category}
              </p>

              <span
                class="status
                ${statusClass(
                  shop.status
                )}"
              >
                ${shop.status.toUpperCase()}
              </span>

            </div>


            <div class="actions">

              <button
                type="button"
                class="btn view"
                onclick="
                  viewShop(${shop.id})
                "
              >
                View
              </button>


              ${
                shop.status ===
                "pending"

                ? `

                  <button
                    type="button"
                    class="btn approve"
                    onclick="
                      approveShop(
                        ${shop.id}
                      )
                    "
                  >
                    Approve
                  </button>


                  <button
                    type="button"
                    class="btn reject"
                    onclick="
                      rejectShop(
                        ${shop.id}
                      )
                    "
                  >
                    Reject
                  </button>

                `

                : `

                  <button
                    type="button"
                    class="btn approve"
                    onclick="
                      approveShop(
                        ${shop.id}
                      )
                    "
                  >
                    Approve Again
                  </button>

                `
              }

            </div>

          `;


          container.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       RENDER ALL SHOPS
    ========================= */

    function renderShops() {

      const container =
        document.getElementById(
          "shopList"
        );


      if (
        shops.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">
            No shops found.
          </div>

        `;

        return;

      }


      container.innerHTML = "";


      shops.forEach(
        shop => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "request-card";


          card.innerHTML = `

            <div class="request-info">

              <h3>
                ${shop.shopName}
              </h3>

              <p>
                👤 ${shop.ownerName}
              </p>

              <p>
                🆔 ${shop.shopId}
              </p>

              <p>
                📍 ${shop.location}
              </p>

              <span
                class="status
                ${statusClass(
                  shop.status
                )}"
              >
                ${shop.status.toUpperCase()}
              </span>

            </div>


            <div class="actions">

              <button
                type="button"
                class="btn view"
                onclick="
                  viewShop(${shop.id})
                "
              >
                View
              </button>


              ${
                shop.status ===
                "approved"

                ? `

                  <button
                    type="button"
                    class="btn suspend"
                    onclick="
                      suspendShop(
                        ${shop.id}
                      )
                    "
                  >
                    Suspend
                  </button>

                `

                : shop.status ===
                  "suspended"

                ? `

                  <button
                    type="button"
                    class="btn activate"
                    onclick="
                      activateShop(
                        ${shop.id}
                      )
                    "
                  >
                    Activate
                  </button>

                `

                : ""

              }

            </div>

          `;


          container.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       APPROVE
    ========================= */

    function approveShop(
      id
    ) {

      const shop =
        shops.find(
          item =>
            item.id === id
        );


      if (!shop) {
        return;
      }


      shop.status =
        "approved";


      saveShops();

      renderAll();


      alert(
        shop.shopName +
        " has been approved."
      );

    }


    /* =========================
       REJECT
    ========================= */

    function rejectShop(
      id
    ) {

      const shop =
        shops.find(
          item =>
            item.id === id
        );


      if (!shop) {
        return;
      }


      const confirmed =
        confirm(
          "क्या आप इस shop request को reject करना चाहते हैं?"
        );


      if (!confirmed) {
        return;
      }


      shop.status =
        "rejected";


      saveShops();

      renderAll();

    }


    /* =========================
       SUSPEND
    ========================= */

    function suspendShop(
      id
    ) {

      const shop =
        shops.find(
          item =>
            item.id === id
        );


      if (!shop) {
        return;
      }


      const confirmed =
        confirm(
          shop.shopName +
          " को suspend करना चाहते हैं?"
        );


      if (!confirmed) {
        return;
      }


      shop.status =
        "suspended";


      saveShops();

      renderAll();

    }


    /* =========================
       ACTIVATE
    ========================= */

    function activateShop(
      id
    ) {

      const shop =
        shops.find(
          item =>
            item.id === id
        );


      if (!shop) {
        return;
      }


      shop.status =
        "approved";


      saveShops();

      renderAll();

    }


    /* =========================
       VIEW SHOP
    ========================= */

    function viewShop(
      id
    ) {

      const shop =
        shops.find(
          item =>
            item.id === id
        );


      if (!shop) {
        return;
      }


      alert(

        "SHOP DETAILS\n\n" +

        "Shop: " +
        shop.shopName +
        "\n" +

        "Owner: " +
        shop.ownerName +
        "\n" +

        "Shop ID: " +
        shop.shopId +
        "\n" +

        "Phone: " +
        shop.phone +
        "\n" +

        "Location: " +
        shop.location +
        "\n" +

        "Category: " +
        shop.category +
        "\n" +

        "Status: " +
        shop.status

      );

    }


    /* =========================
       SEARCH
    ========================= */

    document
      .getElementById(
        "searchRequest"
      )
      .addEventListener(
        "input",
        function() {

          renderRequests(
            this.value
          );

        }
      );


    /* =========================
       LOGOUT
    ========================= */

    function adminLogout() {

      const confirmed =
        confirm(
          "क्या आप Admin Panel से logout करना चाहते हैं?"
        );


      if (confirmed) {

        window.location.href =
          "index.html";

      }

    }


    /* =========================
       RENDER ALL
    ========================= */

    function renderAll() {

      updateStats();

      renderRequests();

      renderShops();

    }


    /* =========================
       START
    ========================= */

    renderAll();

  </script>

</body>
</html>
