<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Use Admin</title><style>body{font-family:Arial;margin:0;background:#f4f6f5;color:#222}header{background:#176b24;color:#fff;padding:15px}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card,.shop{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 12px #0001}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.filter.active{background:#176b24;color:#fff}.shops{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve{background:#176b24;color:#fff}.reject{background:#c62828;color:#fff}.archive{background:#555;color:#fff}.restore{background:#8a5a00;color:#fff}.msg{padding:12px;border-radius:8px;margin:10px 0;display:none}.ok{background:#e3f6e6;color:#176b24}.err{background:#ffe5e5;color:#b00000}@media(max-width:700px){.stats,.shops{grid-template-columns:1fr}.top{flex-direction:column;align-items:stretch}}</style></head><body><header><div class="wrap top"><b>🛡️ Our Use Admin</b><div><button id="home">🏠 Home</button><button id="logout">Logout</button></div></div></header><main class="wrap"><h1>Admin Dashboard</h1><p>Approve, reject या shop को Unused/Archived में रखें।</p><div id="ok" class="msg ok"></div><div id="err" class="msg err"></div><div class="stats"><div class="card">Pending<br><b id="pending">0</b></div><div class="card">Approved<br><b id="approved">0</b></div><div class="card">Rejected<br><b id="rejected">0</b></div><div class="card">Unused / Archived<br><b id="archived">0</b></div></div><div class="filters"><button class="filter active" data-f="pending">Pending</button><button class="filter" data-f="approved">Approved</button><button class="filter" data-f="rejected">Rejected</button><button class="filter" data-f="archived">Unused / Archived</button><button class="filter" data-f="all">All</button><button id="refresh">🔄 Refresh</button></div><div id="shops" class="shops"><div class="card">Loading...</div></div></main><script type="module">
import{auth,db}from'./firebase.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{collection,getDocs,doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let shops=[],filter='pending';
onAuthStateChanged(auth,async u=>{if(!u){location.href='admin-login.html';return}try{const a=await getDoc(doc(db,'admins',u.uid));if(!a.exists()||a.data().role!=='admin'){await signOut(auth);alert('Admin access नहीं है।');location.href='admin-login.html';return}load()}catch(e){console.error(e);error('Admin verification failed: '+(e.code||e.message))}});
async function load(){try{const s=await getDocs(collection(db,'shops'));shops=s.docs.map(d=>({id:d.id,...d.data()}));stats();render()}catch(e){console.error(e);error('Shops load नहीं हुई: '+(e.code||e.message))}}
function stats(){for(const x of ['pending','approved','rejected','archived'])$(x).textContent=shops.filter(s=>(s.status||'pending')===x).length}
function render(){let a=filter==='all'?shops:shops.filter(s=>(s.status||'pending')===filter);$('shops').innerHTML=a.length?a.map(s=>{let st=s.status||'pending';let actions='';if(st==='pending')actions=`<button class="approve" data-a="approved" data-id="${esc(s.id)}">✅ Approve</button><button class="reject" data-a="rejected" data-id="${esc(s.id)}">❌ Reject</button>`;if(st==='approved')actions=`<button class="archive" data-a="archived" data-id="${esc(s.id)}">📦 Move to Unused</button>`;if(st==='rejected')actions=`<button class="approve" data-a="approved" data-id="${esc(s.id)}">✅ Approve Again</button><button class="archive" data-a="archived" data-id="${esc(s.id)}">📦 Move to Unused</button>`;if(st==='archived')actions=`<button class="restore" data-a="pending" data-id="${esc(s.id)}">↩️ Restore Pending</button><button class="approve" data-a="approved" data-id="${esc(s.id)}">✅ Approve</button>`;return `<div class="shop"><h3>🏪 ${esc(s.name||'Shop')}</h3><p><b>Shop ID:</b> ${esc(s.id)}<br><b>Owner ID:</b> ${esc(s.ownerId||'—')}<br><b>Location:</b> ${esc(s.location||'—')}<br><b>Phone:</b> ${esc(s.phone||'—')}<br><b>Status:</b> ${esc(st)}</p><div class="actions">${actions}</div></div>`}).join(''):'<div class="card">📭 इस section में कोई shop नहीं है।</div>'}
$('shops').addEventListener('click',async e=>{let b=e.target.closest('[data-a]');if(!b)return;let id=b.dataset.id,st=b.dataset.a;if(!confirm(st==='archived'?'Shop को Unused/Archived में रखें?':`Shop को ${st} करना है?`))return;b.disabled=true;try{let data={status:st,updatedAt:serverTimestamp()};if(st==='approved'){data.approvedAt=serverTimestamp();data.rejectedAt=null}if(st==='rejected'){data.rejectedAt=serverTimestamp();data.approvedAt=null}if(st==='archived'){data.archivedAt=serverTimestamp();data.archivedBy=auth.currentUser.uid}await updateDoc(doc(db,'shops',id),data);success('Shop status updated');await load()}catch(e){console.error(e);error('Update failed: '+(e.code||e.message));b.disabled=false}});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});$('refresh').onclick=load;$('home').onclick=()=>location.href='index.html';$('logout').onclick=async()=>{if(confirm('Logout?')){await signOut(auth);location.href='admin-login.html'}};function success(x){$('ok').textContent=x;$('ok').style.display='block';$('err').style.display='none'}function error(x){$('err').textContent=x;$('err').style.display='block';$('ok').style.display='none'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
