<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - LocalShop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #176b24;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      font-size: 13px;
      opacity: .9;
      margin-top: 4px;
    }

    .logout-btn {
      border: none;
      background: white;
      color: #176b24;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px 50px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 13px;
      box-shadow: 0 4px 15px #0001;
    }

    .stat-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #176b24;
    }

    .stat-label {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    /* TOOLBAR */

    .toolbar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
      margin-bottom: 15px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 200px;
    }

    .search input,
    .filter select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    /* SHOP CARDS */

    .shop-list {
      display: grid;
      gap: 15px;
    }

    .shop-card {
      background: white;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 4px 15px #0001;
    }

    .shop-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .shop-name {
      color: #176b24;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .shop-id {
      color: #777;
      font-size: 13px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .pending {
      background: #fff1cc;
      color: #a56600;
    }

    .approved {
      background: #e4f7e8;
      color: #16852a;
    }

    .rejected {
      background: #ffe5e5;
      color: #c62828;
    }

    .details {
      margin-top: 15px;

      display: grid;
      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .detail {
      background: #f7f8f7;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .detail strong {
      display: block;
      color: #555;
      margin-bottom: 2px;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve-btn {
      background: #176b24;
      color: white;
    }

    .reject-btn {
      background: #d62828;
      color: white;
    }

    .pending-btn {
      background: #ffb300;
      color: white;
    }

    .delete-btn {
      background: #333;
      color: white;
    }

    .empty {
      background: white;
      padding: 50px 20px;
      text-align: center;
      border-radius: 13px;
      color: #777;
    }

    /* MODAL */

    .modal-overlay {
      display: none;

      position: fixed;
      inset: 0;

      background: #0007;

      z-index: 500;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 14px;
      padding: 22px;
    }

    .modal h2 {
      color: #176b24;
      margin-bottom: 10px;
    }

    .modal p {
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-btn {
      background: #eee;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .details {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {

      header h1 {
        font-size: 19px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        padding: 14px;
      }

      .stat-number {
        font-size: 23px;
      }

      .shop-top {
        flex-direction: column;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <div>
        <h1>
          🛠️ LocalShop Admin
        </h1>

        <p>
          Shop Owner Management Panel
        </p>
      </div>

      <button
        type="button"
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="container">


    <!-- STATISTICS -->

    <section class="stats">

      <div class="stat">

        <div class="stat-icon">
          👥
        </div>

        <div
          id="totalCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Total Applications
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          ⏳
        </div>

        <div
          id="pendingCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Pending
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          ✅
        </div>

        <div
          id="approvedCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Approved
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          ❌
        </div>

        <div
          id="rejectedCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Rejected
        </div>

      </div>

    </section>


    <!-- SEARCH / FILTER -->

    <section class="toolbar">

      <div class="search">

        <input
          type="search"
          id="searchInput"
          placeholder="🔎 Search shop, owner, Shop ID..."
        >

      </div>


      <div class="filter">

        <select
          id="statusFilter"
        >

          <option value="all">
            All Status
          </option>

          <option value="pending">
            Pending
          </option>

          <option value="approved">
            Approved
          </option>

          <option value="rejected">
            Rejected
          </option>

        </select>

      </div>

    </section>


    <!-- SHOP LIST -->

    <section
      id="shopList"
      class="shop-list"
    ></section>

  </main>


  <!-- CONFIRM MODAL -->

  <div
    id="modalOverlay"
    class="modal-overlay"
  >

    <div class="modal">

      <h2 id="modalTitle">
        Confirm Action
      </h2>

      <p id="modalText">
        Are you sure?
      </p>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          type="button"
          class="approve-btn"
          id="confirmBtn"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ==========================================
       LOAD SHOP OWNERS
    ========================================== */

    let owners =
      JSON.parse(
        localStorage.getItem(
          "localShopOwners"
        )
      ) || [];


    /* ==========================================
       CURRENT ACTION
    ========================================== */

    let selectedId = null;

    let selectedAction = null;


    /* ==========================================
       RENDER ADMIN
    ========================================== */

    function renderAdmin() {

      updateStats();

      renderOwners();

    }


    /* ==========================================
       UPDATE STATISTICS
    ========================================== */

    function updateStats() {

      const total =
        owners.length;


      const pending =
        owners.filter(
          owner =>
            owner.status ===
            "pending"
        ).length;


      const approved =
        owners.filter(
          owner =>
            owner.status ===
            "approved"
        ).length;


      const rejected =
        owners.filter(
          owner =>
            owner.status ===
            "rejected"
        ).length;


      document.getElementById(
        "totalCount"
      ).textContent =
        total;


      document.getElementById(
        "pendingCount"
      ).textContent =
        pending;


      document.getElementById(
        "approvedCount"
      ).textContent =
        approved;


      document.getElementById(
        "rejectedCount"
      ).textContent =
        rejected;

    }


    /* ==========================================
       RENDER OWNERS
    ========================================== */

    function renderOwners() {

      const list =
        document.getElementById(
          "shopList"
        );


      const search =
        document.getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


      const filter =
        document.getElementById(
          "statusFilter"
        ).value;


      const filtered =
        owners.filter(
          owner => {

            const matchesSearch =

              !search ||

              String(
                owner.shopName ||
                ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                owner.shopId ||
                ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                owner.ownerName ||
                ""
              )
              .toLowerCase()
              .includes(search) ||

              String(
                owner.phone ||
                ""
              )
              .toLowerCase()
              .includes(search);


            const matchesStatus =

              filter ===
              "all" ||

              owner.status ===
              filter;


            return (
              matchesSearch &&
              matchesStatus
            );

          }
        );


      if (
        filtered.length === 0
      ) {

        list.innerHTML = `

          <div class="empty">

            <h3>
              🏪 No shop found
            </h3>

            <p style="margin-top:8px;">
              अभी कोई matching shop
              application नहीं है।
            </p>

          </div>

        `;

        return;

      }


      list.innerHTML = "";


      /*
        Latest applications first
      */

      filtered
        .slice()
        .reverse()
        .forEach(
          owner => {

            const card =
              document.createElement(
                "article"
              );


            card.className =
              "shop-card";


            const status =
              owner.status ||
              "pending";


            const statusText =

              status ===
              "approved"

                ? "✓ Approved"

              : status ===
                "rejected"

                ? "✕ Rejected"

              : "⏳ Pending";


            card.innerHTML = `

              <div class="shop-top">

                <div>

                  <h2 class="shop-name">

                    🏪
                    ${escapeHtml(
                      owner.shopName ||
                      "Unnamed Shop"
                    )}

                  </h2>

                  <div class="shop-id">

                    Shop ID:
                    <strong>
                      ${escapeHtml(
                        owner.shopId ||
                        "-"
                      )}
                    </strong>

                  </div>

                </div>


                <span
                  class="
                    status
                    ${status}
                  "
                >

                  ${statusText}

                </span>

              </div>


              <div class="details">

                <div class="detail">

                  <strong>
                    👤 Owner
                  </strong>

                  ${escapeHtml(
                    owner.ownerName ||
                    "-"
                  )}

                </div>


                <div class="detail">

                  <strong>
                    📱 Phone
                  </strong>

                  ${escapeHtml(
                    owner.phone ||
                    "-"
                  )}

                </div>


                <div class="detail">

                  <strong>
                    📧 Email
                  </strong>

                  ${escapeHtml(
                    owner.email ||
                    "-"
                  )}

                </div>


                <div class="detail">

                  <strong>
                    🏷️ Category
                  </strong>

                  ${escapeHtml(
                    owner.category ||
                    "-"
                  )}

                </div>


                <div class="detail">

                  <strong>
                    📍 Address
                  </strong>

                  ${escapeHtml(
                    owner.location ||
                    "-"
                  )}

                </div>


                <div class="detail">

                  <strong>
                    🕐 Business Hours
                  </strong>

                  ${
                    owner.openingTime ||
                    "-"
                  }

                  -

                  ${
                    owner.closingTime ||
                    "-"
                  }

                </div>


                <div class="detail">

                  <strong>
                    🌐 Coordinates
                  </strong>

                  ${
                    owner.latitude ||
                    "-"
                  }

                  ,

                  ${
                    owner.longitude ||
                    "-"
                  }

                </div>


                <div class="detail">

                  <strong>
                    📅 Application
                  </strong>

                  ${formatDate(
                    owner.createdAt
                  )}

                </div>

              </div>


              <div class="actions">

                ${
                  status !==
                  "approved"

                    ? `

                      <button
                        type="button"
                        class="approve-btn"
                        onclick="
                          askAction(
                            ${owner.id},
                            'approve'
                          )
                        "
                      >
                        ✅ Approve
                      </button>

                    `

                    : `

                      <button
                        type="button"
                        class="pending-btn"
                        onclick="
                          askAction(
                            ${owner.id},
                            'pending'
                          )
                        "
                      >
                        ↩ Set Pending
                      </button>

                    `
                }


                ${
                  status !==
                  "rejected"

                    ? `

                      <button
                        type="button"
                        class="reject-btn"
                        onclick="
                          askAction(
                            ${owner.id},
                            'reject'
                          )
                        "
                      >
                        ❌ Reject
                      </button>

                    `

                    : ""

                }


                <button
                  type="button"
                  class="delete-btn"
                  onclick="
                    askAction(
                      ${owner.id},
                      'delete'
                    )
                  "
                >
                  🗑 Delete
                </button>

              </div>

            `;


            list.appendChild(
              card
            );

          }
        );

    }


    /* ==========================================
       ASK ACTION
    ========================================== */

    function askAction(
      id,
      action
    ) {

      selectedId =
        id;

      selectedAction =
        action;


      const owner =
        owners.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!owner) {
        return;
      }


      const title =
        document.getElementById(
          "modalTitle"
        );


      const text =
        document.getElementById(
          "modalText"
        );


      const confirm =
        document.getElementById(
          "confirmBtn"
        );


      if (
        action ===
        "approve"
      ) {

        title.textContent =
          "Approve Shop?";

        text.textContent =
          owner.shopName +
          " को approve करने के बाद owner login कर सकेगा और shop live करने की तैयारी की जा सकेगी।";

        confirm.textContent =
          "Approve";

        confirm.style.background =
          "#176b24";

      }


      else if (
        action ===
        "reject"
      ) {

        title.textContent =
          "Reject Shop?";

        text.textContent =
          owner.shopName +
          " की registration request reject हो जाएगी।";

        confirm.textContent =
          "Reject";

        confirm.style.background =
          "#d62828";

      }


      else if (
        action ===
        "pending"
      ) {

        title.textContent =
          "Set Pending?";

        text.textContent =
          owner.shopName +
          " को फिर से pending status में भेज दिया जाएगा।";

        confirm.textContent =
          "Set Pending";

        confirm.style.background =
          "#ff9800";

      }


      else if (
        action ===
        "delete"
      ) {

        title.textContent =
          "Delete Application?";

        text.textContent =
          "यह application permanently delete हो जाएगी।";

        confirm.textContent =
          "Delete";

        confirm.style.background =
          "#333";

      }


      document.getElementById(
        "modalOverlay"
      ).style.display =
        "flex";

    }


    /* ==========================================
       CONFIRM ACTION
    ========================================== */

    document.getElementById(
      "confirmBtn"
    ).addEventListener(
      "click",
      function() {

        if (
          selectedId === null ||
          !selectedAction
        ) {

          closeModal();

          return;

        }


        const index =
          owners.findIndex(
            owner =>
              Number(owner.id) ===
              Number(selectedId)
          );


        if (
          index === -1
        ) {

          closeModal();

          return;

        }


        if (
          selectedAction ===
          "approve"
        ) {

          owners[index].status =
            "approved";

        }


        else if (
          selectedAction ===
          "reject"
        ) {

          owners[index].status =
            "rejected";

        }


        else if (
          selectedAction ===
          "pending"
        ) {

          owners[index].status =
            "pending";

        }


        else if (
          selectedAction ===
          "delete"
        ) {

          owners.splice(
            index,
            1
          );

        }


        /*
          SAVE DATA
        */

        localStorage.setItem(

          "localShopOwners",

          JSON.stringify(
            owners
          )

        );


        closeModal();

        renderAdmin();

      }
    );


    /* ==========================================
       CLOSE MODAL
    ========================================== */

    function closeModal() {

      document.getElementById(
        "modalOverlay"
      ).style.display =
        "none";


      selectedId =
        null;

      selectedAction =
        null;

    }


    /* ==========================================
       SEARCH
    ========================================== */

    document.getElementById(
      "searchInput"
    ).addEventListener(
      "input",
      renderOwners
    );


    /* ==========================================
       FILTER
    ========================================== */

    document.getElementById(
      "statusFilter"
    ).addEventListener(
      "change",
      renderOwners
    );


    /* ==========================================
       DATE FORMAT
    ========================================== */

    function formatDate(
      date
    ) {

      if (!date) {
        return "-";
      }


      const d =
        new Date(date);


      if (
        isNaN(
          d.getTime()
        )
      ) {

        return "-";

      }


      return d.toLocaleString();

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(text);


      return div.innerHTML;

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    function logout() {

      sessionStorage.removeItem(
        "localShopOwnerSession"
      );


      window.location.href =
        "index.html";

    }


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    renderAdmin();

  </script>

</body>
</html>
