<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop - LocalShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #176b24;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 12px #0002;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shop-title {
      font-size: 21px;
      font-weight: bold;
    }

    .shop-location {
      font-size: 12px;
      margin-top: 3px;
      opacity: .9;
    }

    .cart-btn {
      border: none;
      background: white;
      color: #176b24;
      border-radius: 9px;
      padding: 10px 13px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
    }

    .cart-count {
      position: absolute;
      top: -7px;
      right: -7px;
      background: #d62828;
      color: white;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 15px 100px;
    }

    .shop-banner {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px #0001;
    }

    .shop-banner h1 {
      color: #176b24;
      margin-bottom: 5px;
    }

    .shop-banner p {
      color: #777;
      font-size: 13px;
    }

    .search-box {
      margin-top: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #176b24;
    }

    .category-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 0 15px;
    }

    .category-btn {
      white-space: nowrap;
      border: 1px solid #176b24;
      background: white;
      color: #176b24;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .category-btn.active {
      background: #176b24;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
      border: 1px solid #eee;
    }

    .product-image-wrap {
      position: relative;
    }

    .product-image {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .stock-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      padding: 5px 8px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: bold;
    }

    .stock-in {
      background: #e4f7e8;
      color: #176b24;
    }

    .stock-out {
      background: #ffe5e5;
      color: #d62828;
    }

    .product-body {
      padding: 13px;
    }

    .product-name {
      color: #176b24;
      font-size: 17px;
      margin-bottom: 4px;
    }

    .category {
      color: #888;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      min-height: 32px;
    }

    .price {
      color: #176b24;
      font-weight: bold;
      font-size: 18px;
      margin: 9px 0;
    }

    .price small {
      font-size: 11px;
      color: #777;
      font-weight: normal;
    }

    .quantity-title {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .quantity-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .quantity-option {
      border: 1px solid #176b24;
      background: white;
      color: #176b24;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
    }

    .quantity-option.active {
      background: #176b24;
      color: white;
    }

    .add-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .add-btn {
      flex: 1;
      border: none;
      background: #176b24;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    .cart-control {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f1f8f2;
      border-radius: 8px;
      overflow: hidden;
      flex: 1;
    }

    .cart-control button {
      width: 38px;
      height: 38px;
      border: none;
      background: #176b24;
      color: white;
      font-size: 19px;
      cursor: pointer;
    }

    .cart-control span {
      font-weight: bold;
      min-width: 35px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 45px 15px;
      color: #777;
      grid-column: 1 / -1;
    }

    /* CART DRAWER */

    .overlay {
      position: fixed;
      inset: 0;
      background: #0007;
      z-index: 2000;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .cart-drawer {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: min(430px, 100%);
      background: white;
      z-index: 2100;
      transform: translateX(100%);
      transition: .25s;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.show {
      transform: translateX(0);
    }

    .cart-header {
      background: #176b24;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-cart {
      border: none;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 13px;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-item-top {
      display: flex;
      gap: 10px;
    }

    .cart-item img {
      width: 65px;
      height: 65px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      color: #176b24;
    }

    .cart-item-variant {
      color: #777;
      font-size: 11px;
      margin-top: 4px;
    }

    .cart-item-price {
      font-weight: bold;
      margin-top: 4px;
    }

    .cart-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }

    .cart-actions button {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #176b24;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .remove-btn {
      background: #d62828 !important;
      width: auto !important;
      padding: 0 9px;
      font-size: 11px !important;
    }

    .cart-footer {
      border-top: 1px solid #ddd;
      padding: 15px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .checkout-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #176b24;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-empty {
      text-align: center;
      color: #777;
      padding: 50px 15px;
    }

    @media (max-width: 500px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 135px;
      }

      .product-body {
        padding: 10px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 16px;
      }
    }

    @media (max-width: 360px) {
      .products {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <div>
      <div
        id="shopTitle"
        class="shop-title"
      >
        Local Shop
      </div>

      <div
        id="shopLocation"
        class="shop-location"
      >
        Local Store
      </div>
    </div>

    <button
      type="button"
      class="cart-btn"
      onclick="openCart()"
    >
      🛒 Cart

      <span
        id="cartCount"
        class="cart-count"
      >
        0
      </span>

    </button>

  </div>

</header>


<main class="container">

  <section class="shop-banner">

    <h1 id="bannerTitle">
      Shop
    </h1>

    <p>
      अपने पसंदीदा products चुनें और cart में add करें।
    </p>

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="🔍 Product search करें..."
      >

    </div>

  </section>


  <div
    id="categoryRow"
    class="category-row"
  ></div>


  <section
    id="productGrid"
    class="products"
  ></section>

</main>


<!-- CART OVERLAY -->

<div
  id="overlay"
  class="overlay"
  onclick="closeCart()"
></div>


<!-- CART -->

<aside
  id="cartDrawer"
  class="cart-drawer"
>

  <div class="cart-header">

    <strong>
      🛒 Your Cart
    </strong>

    <button
      type="button"
      class="close-cart"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-items"
  ></div>


  <div class="cart-footer">

    <div class="total-row">

      <span>
        Total
      </span>

      <span id="cartTotal">
        ₹0
      </span>

    </div>


    <button
      type="button"
      class="checkout-btn"
      onclick="checkout()"
    >
      Continue to Checkout
    </button>

  </div>

</aside>


<script>

  /* =========================================
     SHOP ID
     
     URL:
     shop.html?shop=shop001
     
     Example:
     shop.html?shop=shop001
  ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const shopId =
    params.get("shop") ||
    "shop001";


  /* =========================================
     DEMO SHOP DATA
  ========================================= */

  const shopInfo = {

    shop001: {

      name:
        "Local Grocery Store",

      location:
        "Main Market"

    },

    shop002: {

      name:
        "RB Store",

      location:
        "Station Road"

    },

    shop003: {

      name:
        "RC Store",

      location:
        "Bus Stand"

    }

  };


  const currentShop =
    shopInfo[shopId] || {

      name:
        "Local Shop",

      location:
        "Nearby"

    };


  document.getElementById(
    "shopTitle"
  ).textContent =
    currentShop.name;


  document.getElementById(
    "bannerTitle"
  ).textContent =
    currentShop.name;


  document.getElementById(
    "shopLocation"
  ).textContent =
    currentShop.location;


  /* =========================================
     GET OWNER PRODUCTS
     
     owner.html saves:
     localShopProducts_SHOPID
  ========================================= */

  function getProducts() {

    return (
      JSON.parse(
        localStorage.getItem(
          "localShopProducts_" +
          shopId
        )
      ) || []
    );

  }


  let products =
    getProducts();


  /* =========================================
     CART STORAGE
  ========================================= */

  function cartStorageKey() {

    return (
      "localShopCart_" +
      shopId
    );

  }


  let cart =
    JSON.parse(
      localStorage.getItem(
        cartStorageKey()
      )
    ) || [];


  /* =========================================
     FILTER
  ========================================= */

  let currentCategory =
    "All";


  /* =========================================
     PRICE CALCULATION
  ========================================= */

  function calculatePrice(
    product,
    quantity
  ) {

    const basePrice =
      Number(
        product.price
      ) || 0;


    const unit =
      product.unit;


    /*
      KG:
      ₹60/kg
      0.25 = ₹15
      0.5 = ₹30
      0.75 = ₹45
      1 = ₹60
    */

    if (
      unit === "kg"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    /*
      LITRE:
      ₹100/L
      0.5L = ₹50
    */

    if (
      unit === "litre"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    /*
      ML:
      ₹0.10/ml
      500ml = ₹50
    */

    if (
      unit === "ml"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    /*
      GRAM:
      price is per gram
    */

    if (
      unit === "gram"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    /*
      PIECE
    */

    if (
      unit === "piece"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    /*
      DOZEN
    */

    if (
      unit === "dozen"
    ) {

      return (
        basePrice *
        Number(quantity)
      );

    }


    return basePrice;

  }


  /* =========================================
     FORMAT PRICE
  ========================================= */

  function money(
    amount
  ) {

    return (
      "₹" +
      Number(
        amount
      ).toFixed(2)
    );

  }


  /* =========================================
     FORMAT UNIT
  ========================================= */

  function formatQuantity(
    product,
    quantity
  ) {

    const unit =
      product.unit;


    quantity =
      Number(
        quantity
      );


    if (
      unit === "kg"
    ) {

      if (
        quantity < 1
      ) {

        return (
          Math.round(
            quantity * 1000
          ) +
          " g"
        );

      }

      return (
        quantity +
        " kg"
      );

    }


    if (
      unit === "litre"
    ) {

      if (
        quantity < 1
      ) {

        return (
          Math.round(
            quantity * 1000
          ) +
          " ml"
        );

      }

      return (
        quantity +
        " L"
      );

    }


    if (
      unit === "ml"
    ) {

      if (
        quantity >= 1000
      ) {

        return (
          quantity / 1000 +
          " L"
        );

      }

      return (
        quantity +
        " ml"
      );

    }


    if (
      unit === "gram"
    ) {

      if (
        quantity >= 1000
      ) {

        return (
          quantity / 1000 +
          " kg"
        );

      }

      return (
        quantity +
        " g"
      );

    }


    if (
      unit === "piece"
    ) {

      return (
        quantity +
        (
          quantity === 1
            ? " Piece"
            : " Pieces"
        )
      );

    }


    if (
      unit === "dozen"
    ) {

      return (
        quantity +
        (
          quantity === 1
            ? " Dozen"
            : " Dozen"
        )
      );

    }


    return quantity;

  }


  /* =========================================
     FIND CART ITEM
  ========================================= */

  function findCartItem(
    productId,
    quantity
  ) {

    return cart.find(
      item =>
        Number(
          item.productId
        ) ===
        Number(
          productId
        ) &&
        Number(
          item.quantity
        ) ===
        Number(
          quantity
        )
    );

  }


  /* =========================================
     GET PRODUCT CART TOTAL
  ========================================= */

  function getProductCartCount(
    productId
  ) {

    return cart
      .filter(
        item =>
          Number(
            item.productId
          ) ===
          Number(
            productId
          )
      )
      .reduce(
        (
          total,
          item
        ) =>
          total +
          Number(
            item.cartQty
          ),
        0
      );

  }


  /* =========================================
     SAVE CART
  ========================================= */

  function saveCart() {

    localStorage.setItem(

      cartStorageKey(),

      JSON.stringify(
        cart
      )

    );

  }


  /* =========================================
     CATEGORIES
  ========================================= */

  function renderCategories() {

    const row =
      document.getElementById(
        "categoryRow"
      );


    const categories = [
      "All",
      ...new Set(
        products
          .map(
            product =>
              product.category
          )
          .filter(Boolean)
      )
    ];


    row.innerHTML = "";


    categories.forEach(
      category => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "category-btn " +
          (
            currentCategory ===
            category
              ? "active"
              : ""
          );


        button.textContent =
          category;


        button.onclick =
          function() {

            currentCategory =
              category;

            renderCategories();

            renderProducts();

          };


        row.appendChild(
          button
        );

      }
    );

  }


  /* =========================================
     SEARCH
  ========================================= */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      function() {

        renderProducts();

      }
    );


  /* =========================================
     RENDER PRODUCTS
  ========================================= */

  function renderProducts() {

    const grid =
      document.getElementById(
        "productGrid"
      );


    const search =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
      products.filter(
        product => {

          const categoryMatch =
            currentCategory ===
            "All" ||
            product.category ===
            currentCategory;


          const searchMatch =
            !search ||
            product.name
              .toLowerCase()
              .includes(
                search
              ) ||
            (
              product.category ||
              ""
            )
              .toLowerCase()
              .includes(
                search
              );


          return (
            categoryMatch &&
            searchMatch
          );

        }
      );


    grid.innerHTML = "";


    if (
      filtered.length === 0
    ) {

      grid.innerHTML = `

        <div class="empty">

          <h3>
            😕 Product नहीं मिला
          </h3>

          <p style="margin-top:7px;">
            कोई दूसरा product search करें।
          </p>

        </div>

      `;

      return;

    }


    filtered.forEach(
      product => {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "product-card";


        const image =
          product.image ||
          "https://via.placeholder.com/500x350?text=No+Image";


        const options =
          product.quantityOptions &&
          product.quantityOptions.length
            ? product.quantityOptions
            : getDefaultOptions(
                product
              );


        const firstOption =
          options[0];


        const selectedQuantity =
          getSelectedQuantity(
            product.id,
            firstOption.value
          );


        const selectedPrice =
          calculatePrice(
            product,
            selectedQuantity
          );


        const cartCount =
          getProductCartCount(
            product.id
          );


        card.innerHTML = `

          <div class="product-image-wrap">

            <img
              class="product-image"
              src="${escapeHtml(
                image
              )}"
              alt="${escapeHtml(
                product.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/500x350?text=No+Image'
              "
            >


            <span
              class="
                stock-badge
                ${
                  product.inStock
                    ? "stock-in"
                    : "stock-out"
                }
              "
            >

              ${
                product.inStock
                  ? "🟢 In Stock"
                  : "🔴 Out of Stock"
              }

            </span>

          </div>


          <div class="product-body">

            <h2 class="product-name">
              ${escapeHtml(
                product.name
              )}
            </h2>


            <div class="category">
              ${escapeHtml(
                product.category ||
                ""
              )}
            </div>


            <div class="description">

              ${escapeHtml(
                product.description ||
                "Fresh and quality product."
              )}

            </div>


            <div
              class="price"
              id="price-${product.id}"
            >

              ${money(
                selectedPrice
              )}

              <small>
                selected quantity
              </small>

            </div>


            <div class="quantity-title">
              Select Quantity
            </div>


            <div
              class="quantity-options"
              id="options-${product.id}"
            ></div>


            <div class="add-row">

              ${
                product.inStock
                  ? `

                    <button
                      type="button"
                      class="add-btn"
                      id="add-${product.id}"
                      onclick="
                        addToCart(
                          ${product.id}
                        )
                      "
                    >

                      ${
                        cartCount > 0
                          ? "🛒 Added"
                          : "🛒 Add to Cart"
                      }

                    </button>

                  `
                  : `

                    <button
                      type="button"
                      class="add-btn"
                      disabled
                    >
                      Out of Stock
                    </button>

                  `
              }


              ${
                product.inStock &&
                cartCount > 0
                  ? `

                    <div
                      class="cart-control"
                      style="display:flex;"
                    >

                      <button
                        type="button"
                        onclick="
                          changeProductCart(
                            ${product.id},
                            -1
                          )
                        "
                      >
                        −
                      </button>


                      <span>
                        ${cartCount}
                      </span>


                      <button
                        type="button"
                        onclick="
                          changeProductCart(
                            ${product.id},
                            1
                          )
                        "
                      >
                        +
                      </button>

                    </div>

                  `
                  : ""
              }

            </div>

          </div>

        `;


        grid.appendChild(
          card
        );


        renderQuantityButtons(
          product,
          options,
          selectedQuantity
        );

      }
    );

  }


  /* =========================================
     DEFAULT OPTIONS
  ========================================= */

  function getDefaultOptions(
    product
  ) {

    if (
      product.unit ===
      "kg"
    ) {

      return [

        {
          value: .25,
          label: "250 g"
        },

        {
          value: .5,
          label: "500 g"
        },

        {
          value: .75,
          label: "750 g"
        },

        {
          value: 1,
          label: "1 kg"
        }

      ];

    }


    if (
      product.unit ===
      "litre"
    ) {

      return [

        {
          value: .25,
          label: "250 ml"
        },

        {
          value: .5,
          label: "500 ml"
        },

        {
          value: .75,
          label: "750 ml"
        },

        {
          value: 1,
          label: "1 L"
        }

      ];

    }


    if (
      product.unit ===
      "piece"
    ) {

      return [

        {
          value: 1,
          label: "1 Piece"
        },

        {
          value: 2,
          label: "2 Pieces"
        },

        {
          value: 3,
          label: "3 Pieces"
        }

      ];

    }


    return [

      {
        value: 1,
        label: "1"
      },

      {
        value: 2,
        label: "2"
      },

      {
        value: 3,
        label: "3"
      }

    ];

  }


  /* =========================================
     SELECTED QUANTITY
  ========================================= */

  const selectedVariants = {};


  function getSelectedQuantity(
    productId,
    defaultValue
  ) {

    if (
      selectedVariants[
        productId
      ] !== undefined
    ) {

      return selectedVariants[
        productId
      ];

    }


    selectedVariants[
      productId
    ] =
      defaultValue;


    return defaultValue;

  }


  /* =========================================
     QUANTITY BUTTONS
  ========================================= */

  function renderQuantityButtons(
    product,
    options,
    selectedQuantity
  ) {

    const container =
      document.getElementById(
        "options-" +
        product.id
      );


    if (!container) {
      return;
    }


    container.innerHTML = "";


    options.forEach(
      option => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "quantity-option";


        if (
          Number(
            option.value
          ) ===
          Number(
            selectedQuantity
          )
        ) {

          button.classList.add(
            "active"
          );

        }


        button.textContent =
          option.label;


        button.onclick =
          function() {

            selectedVariants[
              product.id
            ] =
              Number(
                option.value
              );


            const price =
              calculatePrice(
                product,
                option.value
              );


            const priceElement =
              document.getElementById(
                "price-" +
                product.id
              );


            if (
              priceElement
            ) {

              priceElement.innerHTML =

                money(
                  price
                ) +

                `
                  <small>
                    ${escapeHtml(
                      option.label
                    )}
                  </small>
                `;

            }


            container
              .querySelectorAll(
                ".quantity-option"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );

          };


        container.appendChild(
          button
        );

      }
    );

  }


  /* =========================================
     ADD TO CART
  ========================================= */

  function addToCart(
    productId
  ) {

    const product =
      products.find(
        item =>
          Number(
            item.id
          ) ===
          Number(
            productId
          )
      );


    if (
      !product ||
      !product.inStock
    ) {

      return;

    }


    const options =
      product.quantityOptions &&
      product.quantityOptions.length
        ? product.quantityOptions
        : getDefaultOptions(
            product
          );


    const quantity =
      getSelectedQuantity(
        product.id,
        options[0].value
      );


    const existing =
      findCartItem(
        product.id,
        quantity
      );


    if (
      existing
    ) {

      existing.cartQty += 1;

    }

    else {

      cart.push({

        productId:
          product.id,

        name:
          product.name,

        image:
          product.image,

        unit:
          product.unit,

        quantity:
          quantity,

        quantityLabel:
          formatQuantity(
            product,
            quantity
          ),

        price:
          calculatePrice(
            product,
            quantity
          ),

        cartQty:
          1

      });

    }


    saveCart();

    updateCartCount();

    renderProducts();

    renderCart();

  }


  /* =========================================
     CHANGE PRODUCT CART
  ========================================= */

  function changeProductCart(
    productId,
    amount
  ) {

    const options =
      products.find(
        product =>
          Number(
            product.id
          ) ===
          Number(
            productId
          )
      );


    if (!options) {
      return;
    }


    const quantity =
      getSelectedQuantity(
        productId,
        (
          options.quantityOptions ||
          getDefaultOptions(
            options
          )
        )[0].value
      );


    const item =
      findCartItem(
        productId,
        quantity
      );


    if (!item) {

      if (
        amount > 0
      ) {

        addToCart(
          productId
        );

      }

      return;

    }


    item.cartQty +=
      amount;


    if (
      item.cartQty <= 0
    ) {

      cart =
        cart.filter(
          cartItem =>
            cartItem !==
            item
        );

    }


    saveCart();

    updateCartCount();

    renderProducts();

    renderCart();

  }


  /* =========================================
     CART COUNT
  ========================================= */

  function updateCartCount() {

    const count =
      cart.reduce(
        (
          total,
          item
        ) =>
          total +
          Number(
            item.cartQty
          ),
        0
      );


    document.getElementById(
      "cartCount"
    ).textContent =
      count;

  }


  /* =========================================
     RENDER CART
  ========================================= */

  function renderCart() {

    const container =
      document.getElementById(
        "cartItems"
      );


    if (
      cart.length === 0
    ) {

      container.innerHTML = `

        <div class="cart-empty">

          🛒

          <h3 style="margin-top:10px;">
            Cart खाली है
          </h3>

          <p style="margin-top:5px;">
            Products add करें।
          </p>

        </div>

      `;


      document.getElementById(
        "cartTotal"
      ).textContent =
        "₹0";

      return;

    }


    container.innerHTML = "";


    let total =
      0;


    cart.forEach(
      item => {

        const itemTotal =
          Number(
            item.price
          ) *
          Number(
            item.cartQty
          );


        total +=
          itemTotal;


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "cart-item";


        const image =
          item.image ||
          "https://via.placeholder.com/100?text=No+Image";


        div.innerHTML = `

          <div class="cart-item-top">

            <img
              src="${escapeHtml(
                image
              )}"
              alt="${escapeHtml(
                item.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/100?text=No+Image'
              "
            >


            <div class="cart-item-info">

              <div class="cart-item-name">
                ${escapeHtml(
                  item.name
                )}
              </div>


              <div class="cart-item-variant">

                ${escapeHtml(
                  item.quantityLabel
                )}

              </div>


              <div class="cart-item-price">

                ${money(
                  item.price
                )}
                ×
                ${item.cartQty}

                =
                ${money(
                  itemTotal
                )}

              </div>


              <div class="cart-actions">

                <button
                  type="button"
                  onclick="
                    changeCartQuantity(
                      ${item.productId},
                      ${item.quantity},
                      -1
                    )
                  "
                >
                  −
                </button>


                <strong>
                  ${item.cartQty}
                </strong>


                <button
                  type="button"
                  onclick="
                    changeCartQuantity(
                      ${item.productId},
                      ${item.quantity},
                      1
                    )
                  "
                >
                  +
                </button>


                <button
                  type="button"
                  class="remove-btn"
                  onclick="
                    removeCartItem(
                      ${item.productId},
                      ${item.quantity}
                    )
                  "
                >
                  Remove
                </button>

              </div>

            </div>

          </div>

        `;


        container.appendChild(
          div
        );

      }
    );


    document.getElementById(
      "cartTotal"
    ).textContent =
      money(
        total
      );

  }


  /* =========================================
     CHANGE CART QUANTITY
  ========================================= */

  function changeCartQuantity(
    productId,
    quantity,
    amount
  ) {

    const item =
      cart.find(
        cartItem =>
          Number(
            cartItem.productId
          ) ===
          Number(
            productId
          ) &&
          Number(
            cartItem.quantity
          ) ===
          Number(
            quantity
          )
      );


    if (!item) {
      return;
    }


    item.cartQty +=
      amount;


    if (
      item.cartQty <= 0
    ) {

      cart =
        cart.filter(
          cartItem =>
            cartItem !==
            item
        );

    }


    saveCart();

    updateCartCount();

    renderCart();

    renderProducts();

  }


  /* =========================================
     REMOVE CART ITEM
  ========================================= */

  function removeCartItem(
    productId,
    quantity
  ) {

    cart =
      cart.filter(
        item =>
          !(
            Number(
              item.productId
            ) ===
            Number(
              productId
            ) &&
            Number(
              item.quantity
            ) ===
            Number(
              quantity
            )
          )
      );


    saveCart();

    updateCartCount();

    renderCart();

    renderProducts();

  }


  /* =========================================
     OPEN CART
  ========================================= */

  function openCart() {

    document
      .getElementById(
        "overlay"
      )
      .classList.add(
        "show"
      );


    document
      .getElementById(
        "cartDrawer"
      )
      .classList.add(
        "show"
      );


    renderCart();

  }


  /* =========================================
     CLOSE CART
  ========================================= */

  function closeCart() {

    document
      .getElementById(
        "overlay"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "cartDrawer"
      )
      .classList.remove(
        "show"
      );

  }


  /* =========================================
     CHECKOUT
  ========================================= */

  function checkout() {

    if (
      cart.length === 0
    ) {

      alert(
        "पहले cart में product add करें।"
      );

      return;

    }


    /*
      अभी demo checkout है।
      अगली stage में:
      customer details +
      address +
      order +
      WhatsApp / backend
      जोड़ा जा सकता है।
    */

    localStorage.setItem(

      "localShopCheckoutCart",

      JSON.stringify(
        cart
      )

    );


    window.location.href =
      "checkout.html?shop=" +
      encodeURIComponent(
        shopId
      );

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(
        text
      );


    return div.innerHTML;

  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  renderCategories();

  renderProducts();

  updateCartCount();

  renderCart();

</script>

</body>
</html>
