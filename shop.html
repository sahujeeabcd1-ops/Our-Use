<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop - LocalShop</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    /* HEADER */

    header {
      background: #176b24;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .cart-btn {
      border: none;
      background: white;
      color: #176b24;

      padding: 10px 15px;

      border-radius: 9px;

      font-weight: bold;
      cursor: pointer;
    }

    /* SHOP */

    .shop-header {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;

      background: white;

      border-radius: 15px;

      box-shadow: 0 4px 15px #0001;
    }

    .shop-header h1 {
      color: #176b24;
      margin-bottom: 8px;
    }

    .shop-info {
      color: #666;
      line-height: 1.7;
      font-size: 14px;
    }

    /* SEARCH */

    .search-box {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 0 15px;
    }

    .search-box input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 9px;

      outline: none;

      background: white;
    }

    /* PRODUCTS */

    .products {
      max-width: 1200px;

      margin: auto;

      padding: 0 15px 100px;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(200px, 1fr)
        );

      gap: 16px;
    }

    .product-card {
      background: white;

      border-radius: 14px;

      overflow: hidden;

      box-shadow: 0 4px 15px #0001;

      display: flex;

      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 170px;

      object-fit: cover;

      background: #eee;
    }

    .product-body {
      padding: 14px;

      display: flex;

      flex-direction: column;

      flex: 1;
    }

    .product-name {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .category {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 13px;
      line-height: 1.4;

      min-height: 35px;
    }

    .price {
      color: #176b24;

      font-size: 19px;

      font-weight: bold;

      margin: 10px 0;
    }

    .stock {
      display: inline-block;

      width: fit-content;

      padding: 5px 9px;

      border-radius: 15px;

      font-size: 12px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .in-stock {
      background: #e5f7e8;
      color: #16852a;
    }

    .out-stock {
      background: #ffe5e5;
      color: #d62828;
    }

    /* ADD BUTTON */

    .add-btn {
      width: 100%;

      padding: 11px;

      border: none;

      border-radius: 8px;

      background: #176b24;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .add-btn:disabled {
      background: #aaa;

      cursor: not-allowed;
    }

    /* QUANTITY */

    .quantity-box {
      display: flex;

      align-items: center;

      justify-content: space-between;

      border: 1px solid #ddd;

      border-radius: 8px;

      overflow: hidden;
    }

    .quantity-box button {
      width: 38px;
      height: 38px;

      border: none;

      background: #176b24;

      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    .quantity-number {
      font-weight: bold;

      min-width: 40px;

      text-align: center;
    }

    /* CART DRAWER */

    .overlay {
      display: none;

      position: fixed;

      inset: 0;

      background: #0007;

      z-index: 200;
    }

    .cart {
      position: fixed;

      top: 0;
      right: -430px;

      width: 100%;
      max-width: 430px;

      height: 100vh;

      background: white;

      z-index: 300;

      transition: .3s;

      display: flex;

      flex-direction: column;
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      background: #176b24;

      color: white;

      padding: 16px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .close-cart {
      border: none;

      background: transparent;

      color: white;

      font-size: 25px;

      cursor: pointer;
    }

    .cart-items {
      flex: 1;

      overflow-y: auto;

      padding: 15px;
    }

    .cart-item {
      display: grid;

      grid-template-columns: 65px 1fr;

      gap: 10px;

      padding: 12px 0;

      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 65px;
      height: 65px;

      object-fit: cover;

      border-radius: 8px;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .cart-item-price {
      color: #176b24;

      font-size: 14px;

      margin-bottom: 7px;
    }

    .cart-controls {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .cart-controls button {
      width: 28px;
      height: 28px;

      border: none;

      border-radius: 5px;

      background: #176b24;

      color: white;

      cursor: pointer;
    }

    .remove-btn {
      margin-left: auto;

      background: #d62828 !important;
    }

    .cart-footer {
      padding: 15px;

      border-top: 1px solid #ddd;

      background: white;
    }

    .total {
      display: flex;

      justify-content: space-between;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .order-btn {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #ff6f00;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .empty-cart {
      text-align: center;

      color: #777;

      padding: 50px 15px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .products {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

        padding-left: 10px;
        padding-right: 10px;
      }

      .product-image {
        height: 140px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 16px;
      }

      .cart {
        max-width: 100%;
      }

    }

  </style>
</head>

<body>


  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <div class="logo">
        LocalShop
      </div>

      <button
        type="button"
        class="cart-btn"
        onclick="openCart()"
      >

        🛒 Cart
        <span id="cartCount">0</span>

      </button>

    </div>

  </header>


  <!-- SHOP INFORMATION -->

  <section class="shop-header">

    <h1 id="shopName">
      Shop A
    </h1>

    <div class="shop-info">

      👤 Owner:
      <strong id="ownerName">
        Shop Owner
      </strong>

      <br>

      📍 Sarsa Main Road

      <br>

      🕐 Open:
      8:00 AM -
      9:00 PM

      <br>

      🟢 Available for Online Order

    </div>

  </section>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Search products..."
    >

  </div>


  <!-- PRODUCTS -->

  <main
    id="productList"
    class="products"
  ></main>


  <!-- OVERLAY -->

  <div
    id="overlay"
    class="overlay"
    onclick="closeCart()"
  ></div>


  <!-- CART -->

  <aside
    id="cart"
    class="cart"
  >


    <div class="cart-header">

      <h2>
        🛒 Your Cart
      </h2>

      <button
        type="button"
        class="close-cart"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div
      id="cartItems"
      class="cart-items"
    ></div>


    <div class="cart-footer">

      <div class="total">

        <span>
          Total
        </span>

        <span id="cartTotal">
          ₹0
        </span>

      </div>


      <button
        type="button"
        class="order-btn"
        onclick="placeOrder()"
      >
        📱 Order on WhatsApp
      </button>

    </div>


  </aside>


  <script>


    /* ===================================
       SHOP ID
    =================================== */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const shopId =
      urlParams.get("shop") ||
      "shop001";


    /*
      Demo shop name
    */

    const shopName =
      urlParams.get("name") ||
      "Shop A";


    document.getElementById(
      "shopName"
    ).textContent =
      shopName;


    /* ===================================
       DEFAULT PRODUCTS
    =================================== */

    const defaultProducts = [

      {
        id: 101,

        name: "Rice",

        price: 60,

        unit: "kg",

        category: "Grocery",

        image:
          "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80",

        description:
          "Premium quality rice",

        inStock: true

      },

      {
        id: 102,

        name: "Sugar",

        price: 48,

        unit: "kg",

        category: "Grocery",

        image:
          "https://images.unsplash.com/photo-1581268498187-4a7f7a0b0f12?auto=format&fit=crop&w=600&q=80",

        description:
          "Fine quality sugar",

        inStock: true

      },

      {
        id: 103,

        name: "Toothpaste",

        price: 20,

        unit: "piece",

        category: "Personal Care",

        image:
          "https://images.unsplash.com/photo-1625846030840-4f6d8f0f9e5e?auto=format&fit=crop&w=600&q=80",

        description:
          "Daily use toothpaste",

        inStock: false

      }

    ];


    /* ===================================
       LOAD OWNER PRODUCTS
    =================================== */

    function getProducts() {

      const saved =
        JSON.parse(
          localStorage.getItem(
            "localShopProducts"
          )
        );


      if (
        saved &&
        Array.isArray(saved) &&
        saved.length > 0
      ) {

        return saved;

      }


      return defaultProducts;

    }


    let products =
      getProducts();


    /* ===================================
       CART
    =================================== */

    let cart =
      JSON.parse(
        localStorage.getItem(
          "localShopCart_" + shopId
        )
      ) || [];


    /* ===================================
       SAVE CART
    =================================== */

    function saveCart() {

      localStorage.setItem(

        "localShopCart_" +
        shopId,

        JSON.stringify(cart)

      );

    }


    /* ===================================
       RENDER PRODUCTS
    =================================== */

    function renderProducts(
      search = ""
    ) {

      const container =
        document.getElementById(
          "productList"
        );


      const query =
        search
          .trim()
          .toLowerCase();


      const filtered =
        products.filter(
          product => {

            return (
              !query ||

              product.name
                .toLowerCase()
                .includes(query) ||

              product.category
                .toLowerCase()
                .includes(query)
            );

          }
        );


      if (
        filtered.length === 0
      ) {

        container.innerHTML = `

          <div
            style="
              grid-column:1/-1;
              text-align:center;
              padding:50px;
              color:#777;
            "
          >

            <h3>
              Product नहीं मिला
            </h3>

            <p>
              दूसरा product search करें।
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML = "";


      filtered.forEach(
        product => {

          const quantity =
            getCartQuantity(
              product.id
            );


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "product-card";


          card.innerHTML = `

            <img
              class="product-image"
              src="${
                product.image ||
                "https://via.placeholder.com/500"
              }"
              alt="${escapeHtml(
                product.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/500'
              "
            >


            <div class="product-body">

              <h2 class="product-name">
                ${escapeHtml(
                  product.name
                )}
              </h2>


              <div class="category">
                ${escapeHtml(
                  product.category ||
                  "General"
                )}
              </div>


              <div class="description">
                ${escapeHtml(
                  product.description ||
                  ""
                )}
              </div>


              <div class="price">
                ₹${Number(
                  product.price
                ).toFixed(2)}
                /
                ${escapeHtml(
                  product.unit ||
                  "piece"
                )}
              </div>


              <span
                class="
                  stock
                  ${
                    product.inStock
                      ? "in-stock"
                      : "out-stock"
                  }
                "
              >

                ${
                  product.inStock
                    ? "✓ In Stock"
                    : "✕ Out of Stock"
                }

              </span>


              ${
                product.inStock

                ? quantity > 0

                  ? `

                    <div class="quantity-box">

                      <button
                        type="button"
                        onclick="
                          decreaseProduct(
                            ${product.id}
                          )
                        "
                      >
                        −
                      </button>

                      <span
                        class="quantity-number"
                      >
                        ${quantity}
                      </span>

                      <button
                        type="button"
                        onclick="
                          increaseProduct(
                            ${product.id}
                          )
                        "
                      >
                        +
                      </button>

                    </div>

                  `

                  : `

                    <button
                      type="button"
                      class="add-btn"
                      onclick="
                        addToCart(
                          ${product.id}
                        )
                      "
                    >
                      🛒 Add to Cart
                    </button>

                  `

                : `

                  <button
                    type="button"
                    class="add-btn"
                    disabled
                  >
                    Out of Stock
                  </button>

                `

              }

            </div>

          `;


          container.appendChild(
            card
          );

        }
      );

    }


    /* ===================================
       FIND PRODUCT
    =================================== */

    function findProduct(id) {

      return products.find(
        product =>
          Number(product.id) ===
          Number(id)
      );

    }


    /* ===================================
       GET CART QUANTITY
    =================================== */

    function getCartQuantity(
      id
    ) {

      const item =
        cart.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      return item
        ? item.quantity
        : 0;

    }


    /* ===================================
       ADD TO CART
    =================================== */

    function addToCart(id) {

      const product =
        findProduct(id);


      if (
        !product ||
        !product.inStock
      ) {

        return;

      }


      const existing =
        cart.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (existing) {

        existing.quantity++;

      }

      else {

        cart.push({

          id:
            product.id,

          name:
            product.name,

          price:
            Number(product.price),

          unit:
            product.unit,

          image:
            product.image,

          quantity:
            1

        });

      }


      saveCart();

      renderProducts(
        document.getElementById(
          "searchInput"
        ).value
      );

      renderCart();

    }


    /* ===================================
       INCREASE
    =================================== */

    function increaseProduct(
      id
    ) {

      addToCart(id);

    }


    /* ===================================
       DECREASE
    =================================== */

    function decreaseProduct(
      id
    ) {

      const item =
        cart.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!item) {

        return;

      }


      item.quantity--;


      if (
        item.quantity <= 0
      ) {

        cart =
          cart.filter(
            cartItem =>
              Number(cartItem.id) !==
              Number(id)
          );

      }


      saveCart();

      renderProducts(
        document.getElementById(
          "searchInput"
        ).value
      );

      renderCart();

    }


    /* ===================================
       REMOVE FROM CART
    =================================== */

    function removeFromCart(
      id
    ) {

      cart =
        cart.filter(
          item =>
            Number(item.id) !==
            Number(id)
        );


      saveCart();

      renderProducts(
        document.getElementById(
          "searchInput"
        ).value
      );

      renderCart();

    }


    /* ===================================
       RENDER CART
    =================================== */

    function renderCart() {

      const container =
        document.getElementById(
          "cartItems"
        );


      if (
        cart.length === 0
      ) {

        container.innerHTML = `

          <div class="empty-cart">

            <h3>
              🛒 Cart Empty
            </h3>

            <p>
              Product add करने के लिए
              "Add to Cart" दबाएँ।
            </p>

          </div>

        `;

        updateCartCount();

        document.getElementById(
          "cartTotal"
        ).textContent =
          "₹0";

        return;

      }


      container.innerHTML = "";


      let total = 0;


      cart.forEach(
        item => {

          const itemTotal =
            item.price *
            item.quantity;


          total +=
            itemTotal;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "cart-item";


          div.innerHTML = `

            <img
              src="${
                item.image ||
                "https://via.placeholder.com/100"
              }"
              alt="${escapeHtml(
                item.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/100'
              "
            >


            <div>

              <div class="cart-item-name">
                ${escapeHtml(
                  item.name
                )}
              </div>


              <div class="cart-item-price">

                ₹${item.price}
                /
                ${escapeHtml(
                  item.unit ||
                  "piece"
                )}

              </div>


              <div class="cart-controls">

                <button
                  type="button"
                  onclick="
                    decreaseProduct(
                      ${item.id}
                    )
                  "
                >
                  −
                </button>


                <strong>
                  ${item.quantity}
                </strong>


                <button
                  type="button"
                  onclick="
                    increaseProduct(
                      ${item.id}
                    )
                  "
                >
                  +
                </button>


                <button
                  type="button"
                  class="remove-btn"
                  onclick="
                    removeFromCart(
                      ${item.id}
                    )
                  "
                >
                  🗑
                </button>

              </div>


              <div
                style="
                  margin-top:6px;
                  font-weight:bold;
                "
              >

                ₹${itemTotal.toFixed(2)}

              </div>

            </div>

          `;


          container.appendChild(
            div
          );

        }
      );


      document.getElementById(
        "cartTotal"
      ).textContent =
        "₹" +
        total.toFixed(2);


      updateCartCount();

    }


    /* ===================================
       CART COUNT
    =================================== */

    function updateCartCount() {

      const count =
        cart.reduce(
          (
            total,
            item
          ) =>
            total +
            item.quantity,

          0
        );


      document.getElementById(
        "cartCount"
      ).textContent =
        count;

    }


    /* ===================================
       OPEN CART
    =================================== */

    function openCart() {

      document.getElementById(
        "cart"
      ).classList.add(
        "open"
      );


      document.getElementById(
        "overlay"
      ).style.display =
        "block";


      renderCart();

    }


    /* ===================================
       CLOSE CART
    =================================== */

    function closeCart() {

      document.getElementById(
        "cart"
      ).classList.remove(
        "open"
      );


      document.getElementById(
        "overlay"
      ).style.display =
        "none";

    }


    /* ===================================
       WHATSAPP ORDER
    =================================== */

    function placeOrder() {

      if (
        cart.length === 0
      ) {

        alert(
          "पहले cart में product add करें।"
        );

        return;

      }


      let message =
        "🛒 *New LocalShop Order*%0A%0A";


      message +=
        "*Shop:* " +
        encodeURIComponent(
          shopName
        ) +
        "%0A%0A";


      let total = 0;


      cart.forEach(
        (item, index) => {

          const itemTotal =
            item.price *
            item.quantity;


          total +=
            itemTotal;


          message +=

            (
              index + 1
            ) +

            ". " +

            encodeURIComponent(
              item.name
            ) +

            " × " +

            item.quantity +

            " = ₹" +

            itemTotal.toFixed(2) +

            "%0A";

        }
      );


      message +=
        "%0A*Total: ₹" +
        total.toFixed(2) +
        "*";


      /*
        DEMO NUMBER

        बाद में हर shop का अपना
        WhatsApp number database
        से आएगा।
      */

      const shopWhatsApp =
        "919999999999";


      const whatsappURL =
        "https://wa.me/" +
        shopWhatsApp +
        "?text=" +
        message;


      window.open(
        whatsappURL,
        "_blank"
      );

    }


    /* ===================================
       SEARCH
    =================================== */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        function() {

          renderProducts(
            this.value
          );

        }
      );


    /* ===================================
       ESCAPE HTML
    =================================== */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(text);


      return div.innerHTML;

    }


    /* ===================================
       INITIAL LOAD
    =================================== */

    renderProducts();

    renderCart();

  </script>

</body>
</html>
