<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - LocalShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 35px #0002;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #176b24;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      color: #176b24;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 7px 0 24px;
    }

    .admin-badge {
      text-align: center;
      margin-bottom: 18px;
    }

    .admin-badge span {
      display: inline-block;
      background: #e8f5ea;
      color: #176b24;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #176b24;
    }

    .login-btn {
      width: 100%;
      border: none;
      background: #176b24;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      background: #ffe8e8;
      color: #b00000;
    }

    .success {
      background: #e8f6ea;
      color: #176b24;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #176b24;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .security-note {
      margin-top: 20px;
      padding: 11px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🔐
    </div>

    <h1>
      Admin Panel
    </h1>

    <p class="subtitle">
      LocalShop Administration
    </p>

    <div class="admin-badge">
      <span>🛡️ ADMIN ACCESS</span>
    </div>


    <form id="adminLoginForm">

      <div class="form-group">

        <label for="adminEmail">
          Admin Email
        </label>

        <input
          id="adminEmail"
          type="email"
          placeholder="admin@example.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="adminPassword">
          Password
        </label>

        <input
          id="adminPassword"
          type="password"
          placeholder="Admin password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        id="loginBtn"
        type="submit"
        class="login-btn"
      >
        🔐 Admin Login
      </button>

    </form>


    <div
      id="errorMessage"
      class="message error"
    ></div>


    <div
      id="successMessage"
      class="message success"
    ></div>


    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Website
    </a>


    <div class="security-note">
      यह page केवल authorized administrator के लिए है।
      Admin access Firebase Authentication और Firestore rules से secure किया जाएगा।
    </div>

  </div>


  <script type="module">

    import {
      auth,
      db
    } from "./firebase.js";


    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const form =
      document.getElementById(
        "adminLoginForm"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );

    const successMessage =
      document.getElementById(
        "successMessage"
      );


    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

      successMessage.style.display =
        "none";

    }


    function showSuccess(message) {

      successMessage.textContent =
        message;

      successMessage.style.display =
        "block";

      errorMessage.style.display =
        "none";

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById(
              "adminEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "adminPassword"
            )
            .value;


        loginBtn.disabled =
          true;

        loginBtn.textContent =
          "Checking...";


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /*
           * Admin profile Firestore में:
           *
           * admins/{USER_UID}
           *
           * document मौजूद होना चाहिए।
           */

          const adminRef =
            doc(
              db,
              "admins",
              user.uid
            );


          const adminSnap =
            await getDoc(
              adminRef
            );


          if (
            !adminSnap.exists()
          ) {

            await auth.signOut();


            showError(
              "यह account Admin के रूप में authorized नहीं है।"
            );


            loginBtn.disabled =
              false;

            loginBtn.textContent =
              "🔐 Admin Login";

            return;

          }


          const adminData =
            adminSnap.data();


          if (
            adminData.role !==
            "admin"
          ) {

            await auth.signOut();


            showError(
              "आपके account को Admin permission नहीं मिली है।"
            );


            loginBtn.disabled =
              false;

            loginBtn.textContent =
              "🔐 Admin Login";

            return;

          }


          localStorage.setItem(
            "localShopAdminId",
            user.uid
          );


          localStorage.setItem(
            "localShopAdminLoggedIn",
            "true"
          );


          showSuccess(
            "Admin login successful. Dashboard खोल रहे हैं..."
          );


          loginBtn.textContent =
            "✓ Login Successful";


          setTimeout(
            function() {

              window.location.href =
                "admin.html";

            },
            800
          );

        }

        catch(error) {

          console.error(error);


          let message =
            "Admin login failed.";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Email या password गलत है।";

          }
          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Email सही नहीं है।";

          }
          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "बहुत ज्यादा attempts हुए हैं। थोड़ी देर बाद try करें।";

          }
          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            message =
              "Internet connection check करें।";

          }


          showError(message);


          loginBtn.disabled =
            false;

          loginBtn.textContent =
            "🔐 Admin Login";

        }

      }
    );

  </script>

</body>
</html>
