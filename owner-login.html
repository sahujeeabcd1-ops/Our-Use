<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Owner Login</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #eaf8ed,
          #fff3e8
        );

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;

      background: white;

      padding: 30px;

      border-radius: 18px;

      box-shadow:
        0 10px 35px #0002;
    }

    .logo {
      text-align: center;

      font-size: 28px;
      font-weight: 900;

      color: #176b24;

      margin-bottom: 8px;
    }

    .logo span {
      color: #ff6f00;
    }

    .subtitle {
      text-align: center;

      color: #777;

      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 9px;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: #176b24;
    }

    .login-btn {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #176b24;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #0f561b;
    }

    .back-btn {
      width: 100%;

      margin-top: 12px;

      padding: 11px;

      border: 1px solid #176b24;

      border-radius: 9px;

      background: white;

      color: #176b24;

      font-weight: bold;

      cursor: pointer;
    }

    .demo-info {
      margin-top: 20px;

      padding: 12px;

      border-radius: 9px;

      background: #f5f7f6;

      color: #666;

      font-size: 13px;

      line-height: 1.6;
    }

    .error {
      display: none;

      margin-bottom: 15px;

      padding: 10px;

      border-radius: 8px;

      background: #ffe8e8;

      color: #c62828;

      font-size: 14px;

      text-align: center;
    }

  </style>
</head>


<body>


  <div class="login-box">


    <div class="logo">
      Local<span>Shop</span>
    </div>


    <p class="subtitle">
      Shop Owner Login
    </p>


    <div
      id="errorMessage"
      class="error"
    >
      Invalid Shop ID or Password
    </div>


    <form id="loginForm">


      <div class="form-group">

        <label for="shopId">
          Shop ID
        </label>

        <input
          type="text"
          id="shopId"
          placeholder="Enter Shop ID"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-btn"
      >
        🔐 Login
      </button>


    </form>


    <button
      type="button"
      class="back-btn"
      onclick="goHome()"
    >
      ← Back to Home
    </button>


    <div class="demo-info">

      <strong>Demo Login</strong>

      <br><br>

      Shop ID:
      <strong>shop001</strong>

      <br>

      Password:
      <strong>1234</strong>

    </div>


  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          const shopId =
            document
              .getElementById("shopId")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          /*
            DEMO LOGIN

            बाद में इसे real database
            authentication से connect करेंगे.
          */

          if (
            shopId === "shop001" &&
            password === "1234"
          ) {

            localStorage.setItem(
              "ownerLoggedIn",
              "true"
            );

            localStorage.setItem(
              "ownerShopId",
              shopId
            );


            window.location.href =
              "owner.html?shop=Shop%20A";

          }

          else {

            document
              .getElementById(
                "errorMessage"
              )
              .style.display =
              "block";

          }

        }
      );


    function goHome() {

      window.location.href =
        "index.html";

    }

  </script>


</body>
</html>
