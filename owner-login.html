<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Owner Login - LocalShop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef9f0, #fff4e8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0002;
      overflow: hidden;
    }

    .top {
      background: #176b24;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    .shop-icon {
      width: 70px;
      height: 70px;
      background: white;
      color: #176b24;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .top h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .top p {
      font-size: 14px;
      opacity: .9;
    }

    .form-area {
      padding: 25px;
    }

    .group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #176b24;
      box-shadow: 0 0 0 3px #176b2415;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 9px;
      background: #176b24;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #0f561b;
    }

    .error {
      display: none;
      background: #ffe7e7;
      color: #c62828;
      border-left: 4px solid #d62828;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .info {
      background: #f4f8f4;
      padding: 13px;
      border-radius: 8px;
      margin-top: 18px;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .register-btn,
    .home-btn {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .register-btn {
      background: white;
      border: 1px solid #176b24;
      color: #176b24;
    }

    .home-btn {
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #444;
    }

    .status {
      display: none;
      text-align: center;
      padding: 15px;
      border-radius: 9px;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      background: #e6f7e9;
      color: #176b24;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .form-area {
        padding: 20px;
      }

      .top {
        padding: 23px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <!-- HEADER -->

    <div class="top">

      <div class="shop-icon">
        🏪
      </div>

      <h1>
        Shop Owner Login
      </h1>

      <p>
        Manage your shop and products
      </p>

    </div>


    <!-- FORM -->

    <div class="form-area">

      <div
        id="errorMessage"
        class="error"
      ></div>


      <form
        id="loginForm"
      >

        <div class="group">

          <label for="shopId">
            Shop ID
          </label>

          <input
            type="text"
            id="shopId"
            placeholder="Enter your Shop ID"
            autocomplete="username"
            required
          >

        </div>


        <div class="group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-btn"
        >
          🔐 Login
        </button>

      </form>


      <div
        id="successMessage"
        class="status success"
      >
        ✅ Login successful...
        <br>
        Opening your shop dashboard.
      </div>


      <div class="info">

        <strong>New Shop Owner?</strong>

        <br>

        पहले registration करके अपना shop
        account बनाइए। Admin approval के
        बाद आप login कर पाएँगे।

      </div>


      <button
        type="button"
        class="register-btn"
        onclick="openRegistration()"
      >
        📝 Register Your Shop
      </button>


      <button
        type="button"
        class="home-btn"
        onclick="goHome()"
      >
        ← Back to Home
      </button>

    </div>

  </div>


  <script>

    /* ==========================================
       PASSWORD SHOW / HIDE
    ========================================== */

    const passwordInput =
      document.getElementById(
        "password"
      );

    const showPassword =
      document.getElementById(
        "showPassword"
      );


    showPassword.addEventListener(
      "click",
      function() {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          showPassword.textContent =
            "🙈";

        } else {

          passwordInput.type =
            "password";

          showPassword.textContent =
            "👁️";

        }

      }
    );


    /* ==========================================
       ERROR MESSAGE
    ========================================== */

    function showError(
      message
    ) {

      const error =
        document.getElementById(
          "errorMessage"
        );

      error.textContent =
        message;

      error.style.display =
        "block";

    }


    function hideError() {

      document.getElementById(
        "errorMessage"
      ).style.display =
        "none";

    }


    /* ==========================================
       LOGIN
    ========================================== */

    document
      .getElementById(
        "loginForm"
      )
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();

          hideError();


          const shopId =
            document
              .getElementById(
                "shopId"
              )
              .value
              .trim();


          const password =
            document
              .getElementById(
                "password"
              )
              .value;


          if (!shopId) {

            showError(
              "Please enter your Shop ID."
            );

            return;

          }


          if (!password) {

            showError(
              "Please enter your password."
            );

            return;

          }


          /*
            REGISTERED SHOP OWNERS
          */

          const owners =
            JSON.parse(
              localStorage.getItem(
                "localShopOwners"
              )
            ) || [];


          /*
            FIND SHOP
          */

          const owner =
            owners.find(
              item =>

                String(
                  item.shopId
                )
                .toLowerCase() ===
                shopId.toLowerCase()
            );


          if (!owner) {

            showError(
              "Shop ID नहीं मिला। पहले registration करें।"
            );

            return;

          }


          /*
            CHECK PASSWORD

            NOTE:
            यह केवल frontend demo है।
            Production में password ऐसे
            store नहीं करना चाहिए।
          */

          if (
            String(
              owner.password
            ) !==
            String(password)
          ) {

            showError(
              "Incorrect password."
            );

            return;

          }


          /*
            CHECK ADMIN APPROVAL
          */

          if (
            owner.status !==
            "approved"
          ) {

            if (
              owner.status ===
              "rejected"
            ) {

              showError(
                "आपकी shop registration admin द्वारा reject की गई है।"
              );

            } else {

              showError(
                "आपका shop अभी admin approval के लिए pending है।"
              );

            }

            return;

          }


          /*
            SAVE LOGIN SESSION
          */

          const session = {

            shopId:
              owner.shopId,

            shopName:
              owner.shopName,

            ownerName:
              owner.ownerName,

            phone:
              owner.phone,

            category:
              owner.category,

            latitude:
              owner.latitude,

            longitude:
              owner.longitude,

            loginTime:
              new Date()
                .toISOString()

          };


          sessionStorage.setItem(

            "localShopOwnerSession",

            JSON.stringify(
              session
            )

          );


          /*
            SHOW SUCCESS
          */

          document.getElementById(
            "loginForm"
          ).style.display =
            "none";


          document.getElementById(
            "successMessage"
          ).style.display =
            "block";


          /*
            OPEN OWNER DASHBOARD
          */

          setTimeout(
            function() {

              window.location.href =
                "owner.html";

            },
            800
          );

        }
      );


    /* ==========================================
       REGISTRATION
    ========================================== */

    function openRegistration() {

      window.location.href =
        "owner-register.html";

    }


    /* ==========================================
       HOME
    ========================================== */

    function goHome() {

      window.location.href =
        "index.html";

    }


    /* ==========================================
       IF ALREADY LOGGED IN
    ========================================== */

    const existingSession =
      sessionStorage.getItem(
        "localShopOwnerSession"
      );


    /*
      अभी automatically redirect नहीं कर रहे,
      ताकि login page हमेशा manually खुल सके।
    */

  </script>

</body>
</html>
