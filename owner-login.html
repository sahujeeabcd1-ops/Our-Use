<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login - LocalShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 30px #0002;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      color: #176b24;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 7px 0 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #176b24;
    }

    .login-btn {
      width: 100%;
      border: none;
      background: #176b24;
      color: white;
      padding: 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      margin-top: 4px;
    }

    .login-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .forgot-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: #176b24;
      padding: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      background: #ffe7e7;
      color: #b00000;
    }

    .success {
      background: #e7f7ea;
      color: #176b24;
    }

    .register-link {
      text-align: center;
      margin-top: 17px;
      font-size: 13px;
      color: #777;
    }

    .register-link a {
      color: #176b24;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🏪
    </div>

    <h1>
      Owner Login
    </h1>

    <p class="subtitle">
      अपनी shop manage करने के लिए login करें।
    </p>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="owner@example.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="अपना password डालें"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        id="loginBtn"
        type="submit"
        class="login-btn"
      >
        Login
      </button>

    </form>


    <button
      id="forgotBtn"
      type="button"
      class="forgot-btn"
    >
      Forgot Password?
    </button>


    <div
      id="errorMessage"
      class="message error"
    ></div>


    <div
      id="successMessage"
      class="message success"
    ></div>


    <div class="register-link">

      Account नहीं है?

      <a href="owner-register.html">
        Register करें
      </a>

    </div>

  </div>


  <script type="module">

    /* =====================================
       FIREBASE
    ===================================== */

    import {
      auth,
      db
    } from "./firebase.js";


    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================
       ELEMENTS
    ===================================== */

    const form =
      document.getElementById(
        "loginForm"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const forgotBtn =
      document.getElementById(
        "forgotBtn"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const successMessage =
      document.getElementById(
        "successMessage"
      );


    /* =====================================
       SHOW ERROR
    ===================================== */

    function showError(
      message
    ) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

      successMessage.style.display =
        "none";

    }


    /* =====================================
       SHOW SUCCESS
    ===================================== */

    function showSuccess(
      message
    ) {

      successMessage.textContent =
        message;

      successMessage.style.display =
        "block";

      errorMessage.style.display =
        "none";

    }


    /* =====================================
       LOGIN
    ===================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        if (
          !email ||
          !password
        ) {

          showError(
            "Email और password दोनों डालें।"
          );

          return;

        }


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "Logging in...";


        try {

          /* =============================
             FIREBASE LOGIN
          ============================= */

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /* =============================
             GET OWNER DATA
          ============================= */

          const ownerRef =
            doc(
              db,
              "owners",
              user.uid
            );


          const ownerSnap =
            await getDoc(
              ownerRef
            );


          if (
            !ownerSnap.exists()
          ) {

            showError(
              "Owner profile नहीं मिला। पहले owner registration complete करें।"
            );


            loginBtn.disabled =
              false;


            loginBtn.textContent =
              "Login";


            return;

          }


          const ownerData =
            ownerSnap.data();


          /* =============================
             SAVE LOGIN INFO
          ============================= */

          localStorage.setItem(

            "localShopOwnerId",

            user.uid

          );


          localStorage.setItem(

            "localShopId",

            ownerData.shopId ||
            ""

          );


          localStorage.setItem(

            "localShopName",

            ownerData.shopName ||
            ""

          );


          /* =============================
             SUCCESS
          ============================= */

          showSuccess(
            "Login successful! Dashboard खोल रहे हैं..."
          );


          loginBtn.textContent =
            "Login Successful ✓";


          /* =============================
             REDIRECT
          ============================= */

          setTimeout(
            function() {

              window.location.href =
                "owner.html";

            },
            800
          );


        }

        catch(error) {

          console.error(
            error
          );


          let message =
            "Login नहीं हो सका।";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Email या password गलत है।";

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "इस email से कोई account नहीं मिला।";

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            message =
              "Password गलत है।";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Email सही नहीं है।";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "बहुत ज्यादा login attempts हुए हैं। थोड़ी देर बाद try करें।";

          }

          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            message =
              "Internet connection check करें।";

          }


          showError(
            message
          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "Login";

        }

      }
    );


    /* =====================================
       FORGOT PASSWORD
    ===================================== */

    forgotBtn.addEventListener(
      "click",
      async function() {

        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        if (!email) {

          showError(
            "पहले अपना email डालें।"
          );

          document
            .getElementById(
              "email"
            )
            .focus();

          return;

        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showSuccess(
            "Password reset email भेज दिया गया है। अपना inbox check करें।"
          );

        }

        catch(error) {

          console.error(
            error
          );


          let message =
            "Password reset नहीं हो सका।";


          if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "इस email से account नहीं मिला।";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Email सही नहीं है।";

          }


          showError(
            message
          );

        }

      }
    );

  </script>

</body>
</html>
